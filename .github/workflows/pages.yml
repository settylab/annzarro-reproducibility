# Builds the evidence site and deploys it to GitHub Pages.
# Inactive until Pages is enabled: every job is guarded by the repository variable PAGES_ENABLED.
# To switch it on: Settings > Pages > Source: GitHub Actions, then Settings > Variables > PAGES_ENABLED = true.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the site's provenance badges read git log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evidence/requirements.txt
      - run: pip install -r evidence/requirements.txt
      - name: "Build the site (hosted layout: GitHub links at this commit, WebP images)"
        run: python evidence/build.py --hosted _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
