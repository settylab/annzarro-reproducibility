    - {path: manuscript/figures/screens/focus_sequence/1_HSC_tile.png, what: "diffusion-walk tile, click 1 (HSC)", panels: [b]}
    - {path: manuscript/figures/screens/focus_sequence/2_GMP_tile.png, what: "click 2 (GMP)", panels: [b]}
    - {path: manuscript/figures/screens/focus_sequence/3_cMoP_tile.png, what: "click 3 (cMoP)", panels: [b]}
    - {path: manuscript/figures/screens/focus_sequence/4_Monocyte_tile.png, what: "click 4 (monocyte)", panels: [b]}
    - {path: manuscript/figures/screens/E_table_tile.png, what: "cell table, cell type = HSC AND DA z-score > 2", panels: [c]}
    - {path: manuscript/figures/screens/E_umap_tile.png, what: "linked UMAP masked by the table", panels: [c]}
    - {path: manuscript/figures/screens/app_spatial/row4_*.png, what: "the four plots of d, captured after a click on a cortex spot (AnnZarro v0.4.1, spatial demo)", panels: [d]}
    - {path: manuscript/figures/screens/app_spatial/crops.json, what: "where d's cluster plots are cut to drop the scrolled Leiden legend", panels: [d]}
  panels:
    a: {shows: "four linked panels: walk row on UMAP, volcano by varp row, UMAP by fold change, filtered cell table; inset: one status line enlarged", inputs: [manuscript/figures/screens/overview.png, manuscript/figures/screens/overview_status.json]}
    b: {shows: "the walk panel after four clicks HSC -> GMP -> cMoP -> monocyte", inputs: [manuscript/figures/screens/focus_sequence/*_tile.png]}
    c: {shows: "a two-condition table filter masking a linked UMAP (290 of 8,090 cells)", inputs: [manuscript/figures/screens/E_table_tile.png, manuscript/figures/screens/E_umap_tile.png]}
    d: {shows: "a tissue section (public Visium demo): after a click on a cortex spot, the section and the expression UMAP by Leiden cluster, the section by the spot's expression_walk_t5 row, the UMAP by its spatial_kernel row", inputs: [manuscript/figures/screens/app_spatial/row4_*.png, manuscript/figures/screens/app_spatial/crops.json]}
  upstream:
    - script: figures/screenshots.py
      makes: manuscript/figures/screens/*.png
      command: "venv/bin/python figures/screenshots.py   # separate venv: annzarro 0.4.1 (the tag 78c9da6, or the v0.4.1 wheel), playwright, zarr"
      note: "drives a local AnnZarro server on data/bm_aging.zarr with deep links built from data_prep/demo_panelsets/*.view.json; also writes screens/overview_status.json and fails the run if view E's filter fetches data or a focus click fetches other than one row; figures/SCREENSHOTS.md records AnnZarro 0.4.0 release candidate 3bdeb0913d7e5761c496070dbb30acd2cd32ceb5 (tree bb2ace6d4f0078c41738dabd1bb6f64de15771ca), shot 2026-10-05"
    - {script: data_prep/make_panelsets.py, makes: "data_prep/demo_panelsets/*.view.json (the views A-E)"}
    - {script: data_prep/prepare_annzarro_store.py, makes: data/bm_aging.zarr, command: ".venv/bin/python data_prep/prepare_annzarro_store.py --report data/prepare_report.json"}
    - script: figures/screenshots_app_spatial.py
      makes: "manuscript/figures/screens/app_spatial/*, figures/spatial_views/app_spatial_*.view.json, figures/numbers/app_spatial.json"
      command: "python figures/screenshots_app_spatial.py --annzarro <v0.4.1 venv>/bin/annzarro --port 8841   # playwright, zarr, numpy"
      note: "AnnZarro 0.4.1 (the tag 78c9da6) on data/spatial_demo.zarr (v0.4.1's make_spatial_demo.py plus figures/spatial/add_expression_walk.py); fails unless the click focused the cortex spot and fetched one row of each followed matrix; smoke-tests the after-click views (figures/SCREENSHOTS.md, Fig. 2 spatial row). The numbers keep the name app_spatial.json until the claims are re-sourced"
  gaps:
    - "panel d's captures depend on AnnZarro 0.4.1 (external repository) and on the gitignored data/spatial_demo.zarr; recorded in figures/SCREENSHOTS.md"
    - "screenshots depend on the AnnZarro application, an external repository (0.4.1, the tag 78c9da6, tree 661a454f, per figures/SCREENSHOTS.md); the version is recorded only in prose, not by screenshots.py"
    - "data/bm_aging.zarr is gitignored; rebuilt from Zenodo 10.5281/zenodo.15587768 by data_prep/README.md steps 0-2"
