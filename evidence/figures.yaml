- id: scale
  label: fig:scale
  title: "Tahoe-100M on a laptop: every cell in one plot, and a subset that stays interactive"
  outputs: [manuscript/figures/fig_scale.png, manuscript/figures/fig_scale.pdf]
  script: figures/fig_scale.py
  command: "python figures/fig_scale.py   (--draft draws missing panels as 'awaiting data'; --out DIR writes elsewhere)"
  code: [figures/style.py]
  inputs:
    - {path: figures/scale/tahoe95M_umap_all_cat_panel.png, what: "every cell by cell line, size 1, opacity 0.2", panels: [a]}
    - {path: figures/scale/tahoe95M_malat1_all_gene_panel.png, what: "every cell by MALAT1, colour scale 0 to 400, size 1, opacity 0.2", panels: [b]}
    - {path: figures/scale/tahoe95M_malat1_all_gene.view.json, what: "b's drawn axis ranges (where the box goes) and screenshot time", panels: [b]}
    - {path: figures/scale/tahoe95M_malat1_zoom_all_gene_panel.png, what: "the operator's zoom by MALAT1, opened zoomed, automatic size and opacity", panels: [c]}
    - {path: figures/scale/tahoe95M_malat1_zoom_all_gene.view.json, what: "c's drawn range, marker size and opacity, screenshot time", panels: [b, c]}
    - {path: figures/scale/tahoe95M_malat1_stats.json, what: "MALAT1 over all cells (share under the scale's top) and the cells in c's region", panels: [b, c]}
    - {path: figures/scale/tahoe95M_umap_default_sub_cat_panel.png, what: "part 1 of 957, regular plot, automatic size and opacity", panels: [d]}
    - {path: benchmark/scale/results/browser_v041_events.csv, what: "browser events of the v0.4.1 series (the tag, 78c9da6), clean=true", panels: [e, f, g]}
    - path: benchmark/tool_ceiling/ceilings.csv
      what: "the memory guard's largest allowed and declined sizes (annzarro row)"
      panels: [f, g]
      reads: {where: {tool: annzarro, variant: v041}, columns: [first_fail, max_n_16gb, first_fail_n]}
    - {path: benchmark/scale/results/heapcap_v041.jsonl, what: "the tab's V8 heap limit, default flags (Chromium 153, with the v0.4.1 series)", panels: [g]}
  panels:
    a: {shows: "all 95.6M cells by cell line, large-plot mode", inputs: [figures/scale/tahoe95M_umap_all_cat_panel.png]}
    b: {shows: "all cells by MALAT1, scale 0 to 400 counts; the box marks c", inputs: [figures/scale/tahoe95M_malat1_all_gene_panel.png, figures/scale/tahoe95M_malat1_all_gene.view.json, figures/scale/tahoe95M_malat1_zoom_all_gene.view.json]}
    c: {shows: "the boxed region of b, every cell at automatic size: single cells", inputs: [figures/scale/tahoe95M_malat1_zoom_all_gene_panel.png, figures/scale/tahoe95M_malat1_zoom_all_gene.view.json]}
    d: {shows: "default subset, part 1 of 957 (100,000 cells)", inputs: [figures/scale/tahoe95M_umap_default_sub_cat_panel.png]}
    e: {shows: "browser time per action on the default subset against dataset size", inputs: [benchmark/scale/results/browser_v041_events.csv]}
    f: {shows: "time to the first every-cell plot; the memory guard's rule", inputs: [benchmark/scale/results/browser_v041_events.csv, benchmark/tool_ceiling/ceilings.csv]}
    g: {shows: "peak JS heap at first plot against the heap limit", inputs: [benchmark/scale/results/browser_v041_events.csv, benchmark/scale/results/heapcap_v041.jsonl, benchmark/tool_ceiling/ceilings.csv]}
  upstream:
    - script: benchmark/scale/ceiling/figures_tahoe.py
      makes: "figures/scale/tahoe95M_*_panel.png and *.view.json"
      command: "see figures/scale/commands.txt (one line per shot set)"
    - script: benchmark/scale/summarize_rerun.py
      makes: "benchmark/scale/results/browser_v041_events.csv, browser_v041_summary.csv, http_v041_summary.csv (from results/browser_v041*.jsonl, http_v041.csv)"
      command: python benchmark/scale/summarize_rerun.py
    - {script: benchmark/scale/ceiling/ceiling.py, makes: "benchmark/scale/results/browser_v041*.jsonl (queued by queue_v041.sh)"}
    - {script: benchmark/scale/ceiling/heapcap.py, makes: benchmark/scale/results/heapcap_v041.jsonl}
    - script: benchmark/scale/ceiling/gene_view_stats.py
      makes: figures/scale/tahoe95M_malat1_stats.json
      command: "python benchmark/scale/ceiling/gene_view_stats.py STORE MALAT1 400 figures/scale/tahoe95M_malat1_zoom_all_gene.view.json figures/scale/tahoe95M_malat1_stats.json"
    - {script: benchmark/scale/umap_tahoe.py, makes: "obsm/X_umap of the 95.6M store"}
    - {script: benchmark/scale/build_tahoe.py, makes: "Tahoe-100M stores and prefixes"}
  gaps:
    - "screenshot store $DATA_ROOT/tahoe_scale/stores/n95.6M_plot/tahoe_panel_95.6M_plot.zarr (outside the repo; figures/scale/commands.txt)"
    - "AnnZarro client for the screenshots and the rerun: $ANNZARRO_SRC/.venv-test/bin/annzarro (a worktree of the app repo; README names dominik/release-0.3 d5be664)"
    - "rerun stores $DATA_ROOT/tahoe_scale/stores/{_cold_rerun,rerun_prefix,_scratch_http_rerun} and synthetic stores under $DATA_ROOT/tahoe_scale_ceiling (queue_rerun*.sh)"
    - "commands.txt runs figures_tahoe.py with a virtual environment under benchmark/scale/ceiling/ (machine paths are placeholders)"
    - "the clean-time windows are hard-coded in summarize_rerun.py (OVERLAP) and fig_scale.py (CLEAN_BEFORE); the session log they came from is not in the repo"
  todo: [A1, A2, A12, A16, D3, D4, E2, E6]

