# Figure provenance: one entry per figure as the manuscript includes it.
#
# Read by evidence/tools/figcheck.py (staleness report) and evidence/gen/50_figures.py (site page).
# Found from manuscript/main.tex, body.tex and sections/figs_results.tex (\includegraphics,
# \label, and the order of the \fig... macros in body.tex). Figure numbers are not written here: they come
# from the manuscript's own labels (evidence/tools/fignum.py: manuscript/main.aux, evidence/figure_numbers.json).
#
# Schema
#   id, label                    label is the LaTeX label (its number: fignum.fig(label))
#   (placement)                  not stored: the site finds where the label is placed (fignum.placement)
#   outputs                      files under manuscript/figures/ the manuscript includes; the first png
#                                is the thumbnail. other_outputs: written by the same script for this figure, not included;
#                                not_in_paper: written by the script but in no figure of the paper
#   script, command              the script that writes the outputs, and the command from its docstring
#   code                         repository modules the script imports (a change can change the figure)
#   inputs                       every data file the script reads: {path, what, panels?, external?}
#                                path is a repository path or glob; external: true marks a path outside
#                                the repository or a gitignored one (git cannot date it)
#   related                      files that document the figure but are not read by the script
#   panels                       letter -> {shows, inputs: [paths or globs from inputs]}
#   upstream                     scripts that make the inputs: {script, makes, command?, note?}
#   gaps                         reproducibility gaps: inputs or software outside this repository
#   todo                         ledger rows that touch the figure
figures:

- id: overview
  label: fig:overview
  title: The focus model, the AnnData slots behind it, and AnnZarro compared with other viewers
  outputs: [manuscript/figures/fig1_overview.png, manuscript/figures/fig1_overview.pdf]
  other_outputs: [manuscript/figures/fig_comparison.png, manuscript/figures/fig_comparison.pdf]
  script: figures/fig1_overview.py
  command: .venv/bin/python figures/fig1_overview.py
  code: [figures/fig_comparison.py, figures/style.py]
  inputs:
    - path: figures/fig_comparison.py
      what: "panel c data: the TOOLS marks and the size column are hard-coded in the script (fig1_overview calls fig_comparison.draw())"
      panels: [c]
  related:     # not read by the script, so never makes the figure STALE
    - {path: figures/COMPARISON_NOTES.md, what: "sources for every mark of c, kept in sync with fig_comparison.py by hand"}
    - {path: evidence/matrix/tools/*.yaml, what: "the evidence-curator copy of the c marks; build.py --check compares it with fig_comparison.py"}
  panels:
    a: {shows: "what one click selects (a row for a cell, a column for a gene) and what each panel receives; schematic drawn in code", inputs: []}
    b: {shows: "which stored AnnData array drives which view; schematic drawn in code", inputs: []}
    c: {shows: "feature matrix, tools x capabilities, marks Y/P/N/?, largest documented dataset", inputs: [figures/fig_comparison.py]}
  upstream:
    - {script: notes/comparison/, makes: "audit notes behind the marks (hand-written, per tool)"}
    - {script: evidence/tools/import_notes.py, makes: "evidence/matrix/tools/*.yaml seeded from the notes and the figure"}
  gaps:
    - "figures/fig1_overview.py and figures/fig_comparison.py put the repository root on sys.path; run them from a checkout of this repository"
    - "panel c marks live in code, not in a data file; the evidence YAML is a second copy (F1 would make it the one source)"
  todo: [B1, B2, B3, B4, B5, B6, B7, B8, B9, B10, B11, B12, B13, B14, B15, D1, D3, F1, F5]

