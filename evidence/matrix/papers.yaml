# Papers behind the Fig. 1c marks, per tool, with the section or figure that speaks to each
# matrix column (ids from columns.yaml). Loaded by evidence/tools/refs.py (paper_refs, papers_for).
#
# sections.<column>: [{where, quote, indicates, note?}]
#   where      section heading as printed and/or figure panel or legend
#   quote      verbatim, at most 25 words ("..." marks an elision); every quote was checked
#              by script against the full text named in `fulltext` (2026-10-04)
#   indicates  what this passage alone indicates under the column definition: Y, P or N
# A column absent under a paper means the paper says nothing about it. Nothing is inferred.
# archive: closest Wayback snapshot of the landing page (read-only lookup, from archive.yaml).
# contradictions: places where a paper's text disagrees with notes/comparison/<tool>.md or a mark.
checked: '2026-10-04'
tools:
  cellxgene:
    papers:
    - key: megill2021
      cite: Megill et al. 2021
      role: primary
      doi: 10.1101/2021.04.05.438318
      url: https://doi.org/10.1101/2021.04.05.438318
      title: 'cellxgene: a performant, scalable exploration platform for high dimensional sparse matrices'
      year: 2021
      venue: bioRxiv
      program: Annotate era (pre-Discover cellxgene)
      landing_page: https://www.biorxiv.org/content/10.1101/2021.04.05.438318v1
      checked: '2026-10-04'
      archive: null
      archive_timestamp: null
      fulltext: bioRxiv PDF v1 (posted 2021-04-06), pdftotext -layout
      sections:
        focus:
        - where: Common uses in single-cell biology
          quote: painting the scatterplot by a variable automatically renders its conditional distribution across each other variable
          indicates: N
          note: Colouring by a variable propagates to the histograms; this is feature/metadata colouring, which the strict definition excludes. No pairwise row is involved.
        slots:
        - where: Core features and functionality
          quote: The tool ingests (1) matrix-form datasets ... (2) continuous or categorical metadata in the same format; (3) a pre-computed, initial embedding
          indicates: N
          note: Inputs named are X, obs and an embedding; no layers, varm, obsp or varp.
        spatial:
        - where: Core features and functionality
          quote: a pre-computed, initial embedding of the cells in a low-dimensional space (e.g., PCA, tSNE, UMAP, or spatial coordinates)
          indicates: Y
        - where: Core features and functionality
          quote: The primary visualization is a scatterplot of cells embedded in two dimensions based on their gene expression values or spatial coordinates.
          indicates: Y
        - where: Abstract
          quote: a highly generalizable, web-based interface for exploring high dimensional datasets along categorical, continuous and spatial dimensions
          indicates: Y
        filters:
        - where: Core features and functionality
          quote: Users can filter these visualizations by interacting with facets based ... on gene expression, metadata, and the embedding itself.
          indicates: P
          note: Facet/histogram cross-filtering; no table of cells or genes is described.
        - where: Implementation and architecture
          quote: Most affordances in the interface affect other visualizations and controls (for example, filtering by metadata emphasizes corresponding items in an embedding).
          indicates: P
          note: Filtered items are emphasised, not masked; no table.
        annot:
        - where: Common uses in single-cell biology
          quote: insights about cells (observations) can be annotated within the application to export and share with collaborators and other researchers.
          indicates: Y
        de:
        - where: Common uses in single-cell biology
          quote: use cellxgene’s interactive computation capabilities to calculate differential expression (e.g., t-tests) between any arbitrary set of cells
          indicates: Y
        share:
        - where: Core features and functionality
          quote: Findings can be recorded and shared via exportable annotations.
          indicates: N
          note: What is shared is the annotation data (labels), not a view state; consistent with the notes' proposed N, and it is the only basis for the current P.
        hosted:
        - where: Figure 1 legend
          quote: cellxgene is frequently used to host published and unpublished datasets for public exploration.
          indicates: Y
        - where: Implementation and architecture
          quote: cellxgene’s flexible infrastructure has enabled deployment inside of intranet environments by various institutions for large, private collaborations
          indicates: Y
        static:
        - where: Implementation and architecture
          quote: cellxgene’s architecture consists of a Python server and a JavaScript client.
          indicates: N
        lazy:
        - where: Implementation and architecture
          quote: Data ingress and egress is accomplished by lazy loading of metadata, facilitated by a REST API.
          indicates: P
          note: Lazy client-server transfer of metadata; says nothing about slicing the stored matrix.
        every_cell:
        - where: Implementation and architecture
          quote: To accomplish this with millions of observations in client side JavaScript, we used a combination of D3 [1] WebGL
          indicates: P
          note: Implies client-side WebGL rendering of millions of observations; does not state that every cell is drawn without downsampling.
        subset:
        - where: Core features and functionality
          quote: The combinatorial nature of these affordances facilitates arbitrary exploration, cross-filtering, subsetting, coloring, and computationally re-embedding subpopulations of the data.
          indicates: Y
        - where: Core features and functionality
          quote: users can then probe interesting facets of the data by subsetting, computing differential expression (e.g., t-tests), and re-embedding subpopulations of cells.
          indicates: Y
    - key: czi2025
      cite: CZI Cell Science Program et al. 2025
      role: later
      doi: 10.1093/nar/gkae1142
      url: https://doi.org/10.1093/nar/gkae1142
      title: 'CZ CELLxGENE Discover: a single-cell data platform for scalable exploration, analysis and modeling of aggregated data'
      year: 2025
      venue: Nucleic Acids Research 53(D1):D886-D900
      program: Discover / Explorer
      landing_page: https://academic.oup.com/nar/article/53/D1/D886/7912032
      checked: '2026-10-04'
      archive: https://web.archive.org/web/20260727020852/https://academic.oup.com/nar/article/53/D1/D886/7912032
      archive_timestamp: '20260727020852'
      fulltext: PMC11701654 (PMC-derived plain text)
      sections:
        focus:
        - where: Figure 3 legend, panel A
          quote: UMAPs can be visualized based on metadata categories, including cell type and other metadata categories, or by the expression of one or multiple genes
          indicates: N
          note: Feature/metadata colouring only; excluded by the strict definition.
        remote:
        - where: Results, 'Census provides efficient programmatic access to CZ CELLxGENE data for flexible exploration and reanalysis'
          quote: Census offers efficient, low-latency access for larger-than-memory slices of CZ CELLxGENE data, which users can access through Python and R APIs
          indicates: P
          note: Census (code API on S3), not the Explorer GUI; nothing says Explorer reads user-supplied remote stores.
        - where: Materials and methods, 'TileDB-SOMA development for census'
          quote: As the Census is currently hosted on AWS S3, access to its data is effectively limited only by a user’s network bandwidth and compute resources.
          indicates: P
          note: Census, code access only.
        spatial:
        - where: Discussion
          quote: ongoing work in both CZ CELLxGENE Explorer as well as Census seeks to support these efforts and technologies
          indicates: P
          note: Refers to spatial information; as written (methods dated October 2023), Explorer spatial support is presented as ongoing work, not shipped.
        filters:
        - where: Results, 'Explorer allows interactive exploration and analysis of individual single-cell datasets up to 4 M cells'
          quote: Users can facet these visualizations based on gene expression, metadata and the embedding itself.
          indicates: P
          note: Facet cross-filtering, no table.
        annot:
        - where: Introduction
          quote: CZ CELLxGENE Discover builds on the earlier work CZ CELLxGENE Annotate that enabled exploration, analysis and annotation of large-scale single-cell datasets
          indicates: Y
          note: Annotation editing is attributed to Annotate; Discover is described as 'optimized for dissemination and reanalysis'.
        - where: Results, 'Submission workflow'
          quote: CZ CELLxGENE does not include any alignment, cluster or annotation pipeline so all requirements, including cell population labels, must be provided by the contributor
          indicates: N
          note: About the curation pipeline, not user labelling in the GUI; relevant only in that Discover itself does not produce labels.
        de:
        - where: Results, 'Explorer allows interactive exploration and analysis of individual single-cell datasets up to 4 M cells'
          quote: performing differential gene expression (Welch’s t-test)
          indicates: Y
        - where: Materials and methods, 'Performant visualization and analysis for up to 4 million cells via explorer'
          quote: allow for the interactive comparison of populations of up to 1.5 million cells in under 60 s.
          indicates: Y
        hosted:
        - where: Abstract
          quote: Available via a free-to-use online data portal, CZ CELLxGENE hosts a growing corpus of community-contributed data of over 93 million unique cells.
          indicates: Y
        - where: Introduction
          quote: Features within CZ CELLxGENE, such as ‘Explorer and Gene Expression’, provide easy-to-use no-code web-based visualizations of data from a given dataset or collection
          indicates: Y
        static:
        - where: Materials and methods, 'Performant visualization and analysis for up to 4 million cells via explorer'
          quote: This algorithm and numerous other optimizations in the backend allow for the interactive comparison of populations
          indicates: N
          note: Explorer depends on a backend.
        lazy:
        - where: Materials and methods, 'Performant visualization and analysis for up to 4 million cells via explorer'
          quote: At the heart of its memory efficiency lies the use of TileDB Embedded ... as its data storage engine, a powerful, out-of-core solution
          indicates: Y
        - where: Materials and methods, 'TileDB-SOMA development for census'
          quote: CZI’s single-cell team had previously employed TileDB technology for other CZ CELLxGENE applications, including Explorer and Gene Expression.
          indicates: Y
        every_cell:
        - where: Materials and methods, 'Performant visualization and analysis for up to 4 million cells via explorer'
          quote: we built a custom renderer in WebGL, a JavaScript API for rendering high-performance graphics, to efficiently render millions of points in the cell embeddings
          indicates: Y
        - where: Figure 3 legend, panel A
          quote: A UMAP of all 483 152 cells in the Tabula Sapiens dataset available on Explorer
          indicates: Y
        subset:
        - where: Results, 'Explorer allows interactive exploration and analysis of individual single-cell datasets up to 4 M cells'
          quote: The combinatorial nature of these affordances facilitates arbitrary comparisons through cross-filtering, subsetting and coloring subpopulations of the data (Figure 3A).
          indicates: Y
          note: Unlike the 2021 preprint, re-embedding is no longer listed.
    contradictions:
    - column: subset
      note_claim: 'S4: "Yes, both ... View only: the subset keeps the stored embedding coordinates, nothing is recomputed." (notes/comparison/cellxgene.md, Scale group S4; YAML subset detail)'
      paper: The combinatorial nature of these affordances facilitates arbitrary exploration, cross-filtering, subsetting, coloring, and computationally re-embedding subpopulations of the data.
      key: megill2021
      where: Core features and functionality
      note: Mark Y is not affected, but the primary paper claims subset-and-re-embed; the notes should say the 2021 paper described re-embedding and the current programs do not offer it (NAR 2025 no longer
        lists it).
    - column: hosted
      note_claim: YAML mark P (old reason "curated data only"); notes propose Y
      paper: cellxgene is frequently used to host published and unpublished datasets for public exploration.
      key: megill2021
      where: Figure 1 legend
      note: Both papers (also NAR Abstract, 'free-to-use online data portal') support the proposed Y, not the current P.
    - column: spatial
      note_claim: 'YAML mark Y: "Explorer only: README ''Spatial Mode with Deep Zoom'' (Visium, Slide-seq V2)"'
      paper: ongoing work in both CZ CELLxGENE Explorer as well as Census seeks to support these efforts and technologies
      key: czi2025
      where: Discussion
      note: 'Soft. Timing only: the NAR text presents Explorer spatial support as ongoing; the mark rests on later code and the live Visium demo, so do not cite NAR for spatial Y.'
  vitessce:
    papers:
    - key: keller2025
      cite: Keller et al. 2025
      role: primary
      doi: 10.1038/s41592-024-02436-x
      url: https://doi.org/10.1038/s41592-024-02436-x
      title: 'Vitessce: integrative visualization of multimodal and spatially resolved single-cell data'
      year: 2025
      venue: Nature Methods 22(1):63-67
      landing_page: https://www.nature.com/articles/s41592-024-02436-x?error=cookies_not_supported&code=5b69894d-9f8c-4113-a7e2-974a13eebe3b
      checked: '2026-10-04'
      archive: null
      archive_timestamp: null
      fulltext: PMC11725496 (PMC-derived plain text)
      sections:
        focus:
        - where: Main, 'Integrate and explore multimodal data with coordinated multiple views'
          quote: enabling interactions such as selection of genes and cell types to be reflected in multiple visualizations
          indicates: N
          note: Gene selection propagating to all coordinated views is feature colouring, excluded by the strict definition; no pairwise row.
        slots:
        - where: Methods, 'Data organization'
          quote: AnnData objects, which may contain multiple observation-by-feature matrices, dimensionality reductions and spatial coordinates, can be configured using a higher-level joint file type
          indicates: P
          note: X/layers and obsm; obsp, varp and varm are not mentioned.
        remote:
        - where: Main (paragraph on supported data)
          quote: Vitessce can access files stored on static web servers and cloud object storage
          indicates: Y
        - where: Main, 'Deploy and share interactive visualizations'
          quote: Vitessce loads data from static files stored on standard web servers or cloud object storage systems including Google Cloud Storage and Amazon Web Services S3.
          indicates: Y
        spatial:
        - where: Fig. 2d legend
          quote: Schematic of supported visualization layers in the spatial view of Vitessce, namely, points, spots, segmentations and images
          indicates: Y
        filters:
        - where: Main, 'Integrate and explore multimodal data with coordinated multiple views'
          quote: enabling interactions such as selection of genes and cell types to be reflected in multiple visualizations
          indicates: P
          note: Cell-type selection propagates across views; the paper does not describe a table filter or say whether unselected cells are masked.
        de:
        - where: Main (closing paragraphs)
          quote: Future directions for Vitessce include comparative analysis support, increased scalability and additional visualization types
          indicates: N
          note: Comparative analysis is future work as of the paper.
        - where: Main (paragraph on supported data)
          quote: Data (pre)processing (for example, dimensionality reduction and cell segmentation) must be performed outside of Vitessce or through plugins
          indicates: N
          note: Computation is outside the viewer; DE is not named specifically.
        image:
        - where: Fig. 2a legend
          quote: Visualization of a single-molecule FISH experiment containing multiplexed images, spatially resolved RNA molecules and cell segmentations
          indicates: Y
        - where: Extended Data Fig. 4 legend
          quote: by hiding the cell segmentation masks in the spatial plot, uncovering the underlying image data
          indicates: Y
        share:
        - where: Main, 'Integrate and explore multimodal data with coordinated multiple views'
          quote: Configurations can be saved and shared via uniform resource locator (URL), making the interactive visualization reproducible and trackable
          indicates: Y
        export:
        - where: Main, 'Explore visualizations in different computational environments'
          quote: Export functions are included in the APIs to simplify remote data hosting.
          indicates: N
          note: Data export from the Python/R APIs, not plot image export; the paper says nothing about downloading plots.
        desktop:
        - where: Fig. 1a legend
          quote: Vitessce can be used as a JavaScript component in a web browser or a widget in Python and R analysis environments.
          indicates: N
          note: Forms listed (also Methods, 'Using Vitessce') include no downloadable application.
        hosted:
        - where: Main (closing paragraphs)
          quote: Usage of the framework in the data portals for the Human BioMolecular Atlas Program (HuBMAP)38 and Kidney Precision Medicine Project (KPMP)39
          indicates: P
          note: Multi-user via host portals; Vitessce has no deployment of its own ('38', '39' are reference numbers in the PMC text).
        static:
        - where: Main, 'Deploy and share interactive visualizations'
          quote: Implemented as a client-side web application without server-side requirements
          indicates: Y
        - where: Main
          quote: including in static websites, web applications, data portals, Jupyter Notebooks, RStudio and R Shiny apps
          indicates: Y
        lazy:
        - where: Methods, 'On-demand loading of data subsets'
          quote: 'To scale to large datasets, data loading is deferred in multiple cases: multiscale images, multiscale bitmask-based segmentations, genome-mapped data and per-feature subsets of observation-by-feature
            matrices.'
          indicates: Y
        - where: Methods, 'On-demand loading of data subsets'
          quote: performance is optimized when many observations and few features are stored in each chunk
          indicates: Y
        every_cell:
        - where: Main, 'Tailor visualizations to problem-specific data and biological questions'
          quote: the scatterplots can display millions of cells and the heatmaps can display tens of thousands of features
          indicates: Y
          note: Does not explicitly rule out downsampling; the heatmap aggregates on the GPU (Methods, 'Implementation of custom deck.gl layers'), which concerns features x cells, not the embedding.
    contradictions: []
  cirrocumulus:
    papers:
    - key: li2020
      cite: Li et al. 2020 (Cumulus)
      role: primary
      doi: 10.1038/s41592-020-0905-x
      url: https://doi.org/10.1038/s41592-020-0905-x
      title: Cumulus provides cloud-based data analysis for large-scale single-cell and single-nucleus RNA-seq
      year: 2020
      venue: Nature Methods 17:793-798
      note: No dedicated Cirrocumulus paper; Cirrocumulus is the visualisation component of Cumulus. Only Cirrocumulus passages recorded.
      landing_page: https://www.nature.com/articles/s41592-020-0905-x?error=cookies_not_supported&code=20dab3d7-fe55-408f-9464-a926436fe496
      checked: '2026-10-04'
      archive: null
      archive_timestamp: null
      fulltext: PMC7437817 via NCBI BioC (plain text)
      sections:
        share:
        - where: Results, 'Interactive data visualization, post hoc analysis and data deposition in the Cumulus ecosystem'
          quote: a serverless application that enables interactive data visualization and sharing
          indicates: P
          note: '''Sharing'' is not specified; nothing says a link or file restores the view.'
        desktop:
        - where: Online Methods, 'Cirrocumulus implementation'
          quote: can be run in standalone mode on a personal computer
          indicates: N
          note: Local run, which the definition does not score; no downloadable application.
        hosted:
        - where: Online Methods, 'Cirrocumulus implementation'
          quote: It can be hosted on Google App Engine application for collaborative use
          indicates: Y
        static:
        - where: Results, 'Interactive data visualization, post hoc analysis and data deposition in the Cumulus ecosystem'
          quote: users can visualize their results instantly using Cirrocumulus, a serverless application
          indicates: P
          note: Contradicted within the same paper by the Methods (next entry); 'serverless' likely means no user-managed server (App Engine), not static files.
        - where: Online Methods, 'Cirrocumulus implementation'
          quote: Cirrocumulus consists of a client-side component implemented in JavaScript and a server component implemented in Python.
          indicates: N
          note: The 2020 design has a Python server; the static build the mark rests on is from later docs.
        lazy:
        - where: Results, 'Interactive data visualization, post hoc analysis and data deposition in the Cumulus ecosystem'
          quote: Since Cirrocumulus only downloads to the browser those data that are necessary for visualization (Methods), it is scalable to millions of cells.
          indicates: Y
        - where: Online Methods, 'Cirrocumulus implementation'
          quote: slice variables from a dataset stored as a folder of JSON and PARQUET files
          indicates: Y
        every_cell:
        - where: Online Methods, 'Cirrocumulus implementation'
          quote: can optionally generate statistical summaries on an n-dimensional grid, thus enabling plotting of millions of cells
          indicates: P
          note: Optional server-side binning; default not stated. The notes report this path is commented out at cae75c9, so the Y rests on code, not the paper.
    contradictions:
    - column: static
      note_claim: '"The Results describe it as ''a serverless application that enables interactive data visualization and sharing ...''" (notes/comparison/cirrocumulus.md, What it is)'
      paper: Cirrocumulus consists of a client-side component implemented in JavaScript and a server component implemented in Python.
      key: li2020
      where: Online Methods, 'Cirrocumulus implementation'
      note: Quote is accurate, but the paper is internally inconsistent; do not cite 'serverless' as support for static Y. The static Y must rest on installation.rst, not the paper.
  isee:
    papers:
    - key: ruealbrecht2018
      cite: Rue-Albrecht et al. 2018
      role: primary
      doi: 10.12688/f1000research.14966.1
      url: https://doi.org/10.12688/f1000research.14966.1
      title: 'iSEE: Interactive SummarizedExperiment Explorer'
      year: 2018
      venue: F1000Research 7:741
      landing_page: https://f1000research.com/articles/7-741/v1
      checked: '2026-10-04'
      archive: https://web.archive.org/web/20260802032036/https://f1000research.com/articles/7-741/v1
      archive_timestamp: '20260802032036'
      fulltext: PMC6013759 (PMC-derived plain text, includes the three open referee reports)
      sections:
        cells:
        - where: Figure 1 legend (A); 'Using a multi-panel layout' panel-type list
          quote: Panel types are available to visualise sample-based reduced dimensionality embeddings (iii), sample-level metadata (iv), and experimental observations across samples for each feature (v).
          indicates: N
          note: Enumeration of panel types; none takes a sample x sample matrix. Absence, not an explicit refutation.
        genes:
        - where: Figure 1 legend (A); 'Using a multi-panel layout' panel-type list
          quote: Other panel types include row statistics tables (vi), to facilitate searching across features and their metadata; heatmaps (vii) ... and feature-level metadata plots.
          indicates: N
          note: No panel takes a feature x feature matrix. Absence only.
        focus:
        - where: Figure 1 legend (B)
          quote: feature X in the row statistics table determines the y-axis of the feature assay plot, and colours the samples ... by the expression of X
          indicates: N
          note: Feature colouring/axis from a single selection, which the strict definition excludes; supports the proposed N.
        slots:
        - where: Interface implementation, 'Using a multi-panel layout'
          quote: All data aspects stored in a SummarizedExperiment can be simultaneously examined in the multi-panel layout of the iSEE interface
          indicates: P
          note: The listed panels cover assays, colData, rowData and reducedDim only; no pairwise slot is named.
        filters:
        - where: Interface implementation, 'Dynamic linking between panels'
          quote: selections in transmitting panels control the inclusion and appearance of the corresponding data points in receiving panels
          indicates: Y
        - where: Interface implementation, 'Dynamic linking between panels'
          quote: Row statistics tables can also transmit to various plot types ... by defining a subset of features to visualise in a heatmap.
          indicates: P
          note: Table to heatmap only; search-field filters masking every plot are not described in the paper.
        annot:
        - where: Referee report 1 (open peer review appended to the article)
          quote: it would be very useful to enable users to fill new columns of colData based on the interactive grouping of samples
          indicates: N
          note: Reviewer request, so absent in v1; reviewer text, not the authors'.
        de:
        - where: Referee report 1
          quote: In the context of single-cell or large-scale analyses, it would be helpful to implement tools for differential abundance analyses and gene set enrichment analyses.
          indicates: N
          note: Reviewer request; absent in v1. The current P rests on the later iSEEu DynamicMarkerTable.
        share:
        - where: Interface implementation, 'Code tracking and reproducibility'
          quote: the code required to reproduce the current state of the interface can also be reported ... used in startup scripts to launch an iSEE instance
          indicates: P
          note: State is restored by code at launch, not by a link or file in the GUI.
        export:
        - where: Interface implementation, 'Code tracking and reproducibility'
          quote: iSEE automatically memorises the exact R code that was used to generate every plot
          indicates: P
          note: Plots reproducible by running code; the paper does not mention image download.
        desktop:
        - where: Referee report 3
          quote: requires that the colleague either have R, iSEE, and all its dependencies installed, or that you have a server running all necessary packages
          indicates: N
        hosted:
        - where: Referee report 3
          quote: or that you have a server running all necessary packages that you can point the colleague to
          indicates: Y
          note: Reviewer text.
        - where: Conclusion
          quote: we also anticipate that public instances of iSEE will accompany publications to enable authors to showcase important aspects of their data
          indicates: P
          note: Anticipated, not a documented deployment.
        static:
        - where: Introduction
          quote: iSEE is implemented in R using the Shiny framework
          indicates: N
          note: 'Needs a live R/Shiny process (also referee report 3: ''a function of how Shiny works'').'
        every_cell:
        - where: Interface implementation, 'Additional functionalities'
          quote: For large data sets, points can be downsampled in a density-dependent manner to accelerate rendering of the plots
          indicates: P
          note: Optional downsampling; the paper does not say what the default is (the Y rests on Downsample = FALSE in code).
        subset:
        - where: Figure 1 legend (B)
          quote: Selection of points in the reduced dimension plot ... also determines the samples that are shown in the column data ... plot
          indicates: Y
    - key: benedetti2025
      cite: Benedetti et al. 2025
      role: later
      doi: 10.1093/bioadv/vbaf107
      url: https://doi.org/10.1093/bioadv/vbaf107
      title: 'iSEEtree: interactive explorer for hierarchical data'
      year: 2025
      venue: Bioinformatics Advances 5:vbaf107
      landing_page: https://academic.oup.com/bioinformaticsadvances/article/doi/10.1093/bioadv/vbaf107/8125648
      checked: '2026-10-04'
      archive: null
      archive_timestamp: null
      fulltext: PMC12095132 (PMC-derived plain text)
      sections:
        filters:
        - where: 3.1 Use cases
          quote: a selection of samples or features can be simultaneously shared across panels without having to subset the original TreeSE object
          indicates: P
          note: Selection sharing; no table filter described.
        export:
        - where: 2.2 Operative framework
          quote: Once the desired plots are achieved, they can be downloaded to report and publish findings.
          indicates: Y
        - where: 2.3 App functionality
          quote: our app inherits the complete set of functionality from this foundation, including ... code tracking for reproducibility and downloadable results
          indicates: Y
          note: States the download feature is inherited from iSEE itself.
        desktop:
        - where: 4.1 Limitations
          quote: it is still necessary to build TreeSE objects and launch the app either from R or RStudio
          indicates: N
        lazy:
        - where: 4.1 Limitations
          quote: store the assays of the TreeSE object as out-of-memory matrices provided by the HDF5Matrix class, which accesses data from an HDF5 file
          indicates: P
          note: Assays only, server side; matches the current P.
        subset:
        - where: 2.2 Operative framework
          quote: provides several parameters to transform data (Data parameters), control aesthetics (Visual parameters), and subset the data (Selection parameters)
          indicates: Y
    contradictions:
    - column: share
      note_claim: 'YAML mark Y: "''Display panel settings'' offers ''Download RDS'' of the panel list ... Shiny URL bookmarking can launch a state ''by simply clicking a link''"'
      paper: the code required to reproduce the current state of the interface can also be reported ... used in startup scripts to launch an iSEE instance
      key: ruealbrecht2018
      where: Interface implementation, 'Code tracking and reproducibility'
