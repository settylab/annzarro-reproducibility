      sections:
        cells:
        - where: 2 Application overview, step 6
          quote: community detection on a shared nearest neighbor (SNN) graph where each cell is a node and edges connect neighboring cells
          indicates: N
          note: Cell graph computed internally for clustering; never described as shown as colour or axis.
        focus:
        - where: 4.1 Interlinked graphics
          quote: For example, we can color the embeddings according to the expression of a gene selected from the marker table.
          indicates: N
          note: Gene colouring of the embedding, excluded by the strict definition.
        remote:
        - where: 2 Application overview, step 1
          quote: We import a gene-by-cell count matrix from the user’s machine
          indicates: N
          note: v1 has local files only; ExperimentHub appears in the JOSS version.
        filters:
        - where: 2 Application overview
          quote: potential marker genes are ranked and filtered according to the magnitude of upregulation over other clusters
          indicates: N
          note: Table-only filter.
        annot:
        - where: 4.1 Interlinked graphics
          quote: Users can create a custom selection by brushing on regions of interest in the embedding panel.
          indicates: P
          note: Selections, not user-typed labels.
        - where: 4.1 Interlinked graphics
          quote: Each custom selection and its statistics are treated as part of the analysis state and are saved during export.
          indicates: P
        de:
        - where: 2 Application overview, step 7
          quote: Each cluster is characterized through differential expression analyses to detect its marker genes.
          indicates: Y
        - where: 4.1 Interlinked graphics
          quote: If this selection is saved, kana will perform a differential expression analysis to detect upregulation inside the selection compared to all other cells.
          indicates: Y
        share:
        - where: 4.3 Exporting and reloading
          quote: files exported by one user can be reloaded by other users on different machines, allowing users to easily share their analyses
          indicates: P
          note: Analysis state, not view state.
        - where: 4.1 Interlinked graphics
          quote: users can save specific views of the embeddings for later perusal.
          indicates: N
          note: In-app gallery within the session, not a link or file.
        desktop:
        - where: 5 Discussion
          quote: This eliminates the difficulties of software installation and makes the analysis accessible to a non-programming audience.
          indicates: N
          note: Browser app; no desktop build.
        hosted:
        - where: 5 Discussion
          quote: the former automatically distributes analyses of many datasets across any number of machines at no cost and with no configuration.
          indicates: P
          note: Compute is per client; no shared server state.
        static:
        - where: 1 Introduction
          quote: Most obviously, we do not need a scalable backend server to perform any of the calculations, simplifying deployment and reducing costs.
          indicates: Y
        - where: 3.2 Parallelization with web workers
          quote: when hosting on institutional sites or public sites such as GitHub Pages. Instead, we use a service worker to cache and re-serve kana
          indicates: Y
        lazy:
        - where: 3.3 Creating layered sparse matrices
          quote: a dataset with 30,000 genes and 100,000 cells at 5% density requires around 500 MB of memory in this data structure.
          indicates: N
          note: Whole count matrix held in memory (layered sparse).
        - where: 3.4 Examining memory usage
          quote: This limit is a consequence of the use of 32-bit pointers in the current Wasm specification
          indicates: N
          note: 4 GB Wasm heap cap on in-memory data; Table 3 gives 2480.81 MB for Zilionis (173,954 cells).
        every_cell:
        - where: 2 Application overview
          quote: where each cell is a point that is colored by cluster identity or gene expression.
          indicates: Y
    contradictions:
    - column: null
      note_claim: I quote memory figures from that file [kana-paper main.tex]; I did not diff it against the bioRxiv PDF.
      paper: Importantly, kana’s memory usage lies below Wasm’s hard limit of 4 giga- bytes of addressable memory.
      key: lun2022
      where: 3.4 Examining memory usage; Table 3 (Zilionis 173954 cells, 2480.81 MB)
      note: 'Not a contradiction: bioRxiv v1 already has the memory table and the 4 GB sentence, so the scale claim can cite the preprint instead of an unpublished .tex. The quote keeps the PDF line-break
