          indicates: N
          note: Gene colouring only, excluded by the strict definition.
        slots:
        - where: Usage
          quote: kana’s “explore-only” mode ... to load RDS or H5AD files containing pre-computed clusterings and low-dimensional embeddings.
          indicates: N
          note: Only clusterings (obs) and embeddings (obsm) are named; no varm/obsp/varp.
        remote:
        - where: Usage
          quote: Users can supply data in several formats, such as Matrix Market files ... or datasets from public repositories like Bioconductor’s ExperimentHub
          indicates: P
          note: Curated public datasets only; no user URL or object store mentioned.
        filters:
        - where: Usage (Fig. 2 description)
          quote: potential marker genes are ranked and filtered according to the magnitude of upregulation over other clusters
          indicates: N
          note: Filters the marker table only, not plots.
        de:
        - where: Summary
          quote: The application provides a streamlined one-click workflow ... starting from a count matrix and finishing with marker detection.
          indicates: Y
        share:
        - where: Statement of need
          quote: Once finished, users can save their analysis and results for later examination or sharing with collaborators.
          indicates: P
          note: Restores the analysis, not the view.
        - where: Usage
          quote: The exported results can be quickly reloaded in a new browser session, allowing users or their collaborators to explore existing results without repeating the computation.
          indicates: P
        desktop:
        - where: Usage
          quote: this is achieved via the browser and does not require installation of additional software like, e.g., the 10X Genomics Loupe browser.
          indicates: N
          note: Web app by design; also independent confirmation that Loupe is an installed desktop application.
        hosted:
        - where: Further comments
          quote: No funding is required for a centralized backend, ... kana can be used by anyone for free.
          indicates: P
          note: One public deployment, but every visitor computes on their own machine with their own data; matches the notes' P.
        static:
        - where: Summary
          quote: kana leverages web technologies such as WebAssembly ... avoiding the need to provision and maintain a backend service.
          indicates: Y
        - where: Further comments
          quote: No dependency on a backend server, which greatly simplifies application deployment and maintenance for developers.
          indicates: Y
        every_cell:
        - where: Usage (Fig. 2 description)
          quote: One panel contains a scatter plot for the low-dimensional embeddings, where each cell is a point
          indicates: Y
          note: No downsampling mentioned; consistent with notes S2.
    - key: lun2022
      cite: Lun & Kancherla 2022 (preprint)
      role: preprint-of:lun2023
      doi: 10.1101/2022.03.02.482701
      url: https://doi.org/10.1101/2022.03.02.482701
      title: Powering single-cell analyses in the browser with WebAssembly
      year: 2022
      venue: bioRxiv
