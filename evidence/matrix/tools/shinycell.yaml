  de:
    mark: N
    reason: >-
      No gene ranking is computed; ShinyCell2 adds p-values for one gene's violins (kruskal/anova, wilcox/t-test),
      which is not DE.
    detail: |-
      **Checked in the running app (2026-10-04).** Local ShinyCell violin tab: only plot controls, no test. ShinyCell2 showcase violin tab: "Perform global test: none, kruskal.test, anova" and "Perform pairwise test: none, wilcox.test, t.test", which put p-values on one gene's violins. No gene ranking, so N holds. *Steps:* Local: Violinplot / Boxplot. Showcase: Spatial Data > Violinplot / Boxplot. *Evidence:* [m10_violin_tab_no_de.jpg](screens/shinycell/m10_violin_tab_no_de.jpg), [m10_shinycell2_violin_test_option.jpg](screens/shinycell/m10_shinycell2_violin_test_option.jpg)

      **Source and docs.** ShinyCell2 says it offers "global ANOVA or pairwise comparisons ... between cell populations". Those are per-gene tests drawn as p-values on one gene's violin, with no gene ranking or marker table, so they are not differential expression across genes. For ShinyCell2 that is at most P; ShinyCell itself has none. No marker or DE code. ShinyCell2 offers a p-value overlay on violin/box plots: "Perform pairwise test: none, wilcox.test, t.test" and kruskal/anova (SC2 [`R/writer2.R#L560-L564`](https://github.com/the-ouyang-lab/ShinyCell2/blob/33bfc8ba232f0c829b6b23181cb83089d58e7879/R/writer2.R#L560-L564)), one gene at a time; no gene ranking.
