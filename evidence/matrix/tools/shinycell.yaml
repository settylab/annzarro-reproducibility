  lazy:
    mark: Y
    reason: >-
      Expression lives in HDF5 with one gene per chunk and is read one gene at a time per plot, so the
      figure's P should be Y.
    detail: |-
      **Checked in the running app (2026-10-04).** Observation: `app/sc1gexpr.h5` holds `grp/data` (8090 × 16285, float32, gzip) with chunks **(8090, 1)**, one gene per chunk; `server.R` opens it per request (`H5File$new(inpH5, mode = "r")`, 6 call sites). Metadata (`sc1meta.rds`, 701 kB) is read whole at start. *Steps:* `h5py.File("$DEMO_ROOT/shinycell/app/sc1gexpr.h5")["grp/data"].chunks`; `grep -n H5File app/server.R`

      **Source and docs.** The paper agrees: "only the expression of genes that are plotted are loaded". The builder writes expression to HDF5 with one chunk per gene, `chunk_dims = c(1, ncells)` (SC [`R/makeShinyFiles.R#L314-L317`](https://github.com/SGDDNB/ShinyCell/blob/5c61db78cdd624636e161406d5d42aeb2c0f1205/R/makeShinyFiles.R#L314-L317); SC2 [`R/makeH5fromAnndata.R#L27-L30`](https://github.com/the-ouyang-lab/ShinyCell2/blob/33bfc8ba232f0c829b6b23181cb83089d58e7879/R/makeH5fromAnndata.R#L27-L30)). The app opens the file per request and reads only the plotted gene's row: `h5data$read(args = list(inpGene[inp2], quote(expr=)))` (SC [`R/writer.R#L166-L170`](https://github.com/SGDDNB/ShinyCell/blob/5c61db78cdd624636e161406d5d42aeb2c0f1205/R/writer.R#L166-L170)). README: "Only the expression of genes that are plotted are loaded into memory" (SC [`README.md#L32-L34`](https://github.com/SGDDNB/ShinyCell/blob/5c61db78cdd624636e161406d5d42aeb2c0f1205/README.md#L32-L34)). Metadata and embeddings are loaded whole (`readRDS`, [`R/writer.R#L24-L27`](https://github.com/SGDDNB/ShinyCell/blob/5c61db78cdd624636e161406d5d42aeb2c0f1205/R/writer.R#L24-L27)). The old P cited build-time memory, which is a scale fact, not a read-path fact.

      **Scale group.** **Server (R process)**: expression is lazy, one HDF5 row per plotted gene; metadata and embeddings are loaded whole into server RAM at app start. The browser receives a rendered PNG, never the data. The **build** step loads the whole object into RAM. Evidence: Expression read SC `R/writer.R#L166-L170`; `readRDS` of meta SC `R/writer.R#L24-L27`, SC2 `R/writer1.R#L31-L35`; build memory SC [`README.md#L199-L204`](https://github.com/SGDDNB/ShinyCell/blob/5c61db78cdd624636e161406d5d42aeb2c0f1205/README.md#L199-L204).
