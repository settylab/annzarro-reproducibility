      **Scale group.** **Yes, by metadata group**: every plot panel has "Toggle to subset cells", then "Cell information to subset" (a categorical field) and "Select which cells to show" (checkboxes, plus select/deselect all). Unselected cells are drawn grey in the background on embeddings. No random downsample, no subset-and-recompute, no subset-to-selection. Evidence: SC [`R/writer.R#L1242-L1249`](https://github.com/SGDDNB/ShinyCell/blob/5c61db78cdd624636e161406d5d42aeb2c0f1205/R/writer.R#L1242-L1249) (UI), [`#L681-L684`](https://github.com/SGDDNB/ShinyCell/blob/5c61db78cdd624636e161406d5d42aeb2c0f1205/R/writer.R#L681-L684) (checkbox group), [`#L100-L104`](https://github.com/SGDDNB/ShinyCell/blob/5c61db78cdd624636e161406d5d42aeb2c0f1205/R/writer.R#L100-L104) (grey background cells); SC2 [`R/writer2.R#L97-L100`](https://github.com/the-ouyang-lab/ShinyCell2/blob/33bfc8ba232f0c829b6b23181cb83089d58e7879/R/writer2.R#L97-L100). Demo: shinycell1, "CellInfo vs GeneExpr", click "Toggle to subset cells".

