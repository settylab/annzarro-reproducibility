  cells:
    mark: P
    reason: >-
      An obsp row can be copied into obs and drawn on an embedding, but only by code, re-run for each
      cell, so P.
    detail: |-
      **Checked in the running app (2026-10-04).** Row 4236 of `obsp["connectivities"]` copied to an obs column and drawn on UMAP (and, in the Focus section, `obsp["diffusion_distance"]` on two embeddings). Code only; one re-run per cell. *Steps:* script block m04; `focus_row.py` *Evidence:* [m04 (right panel)](screens/scanpy-seurat/m04_slots_obsm_layers_obsp_by_code.jpg), [01_obsp_row_by_code.jpg](screens/scanpy-seurat/01_obsp_row_by_code.jpg)

      **Source and docs.** Code: `adata.obs["d"] = adata.obsp["distances"][i].toarray().ravel(); sc.pl.umap(adata, color="d")`. Seurat: `obj@graphs` holds cell × cell graphs, same pattern with `FeaturePlot`. No GUI; one re-run per focused cell.
