  remote:
    mark: P
    reason: >-
      anndata.experimental.read_lazy reads a remote zarr over HTTP/S3/GCS lazily, by code and with optional
      packages (one gene of a 275k-cell store in 42 s), so the figure's ? should be P.
    detail: |-
      **Checked in the running app (2026-10-04).** Observation: `anndata.experimental.read_lazy(FsspecStore.from_url("https://vitessce-demo-data.storage.googleapis.com/anndata-demos/BALF_VIB-UGent_processed_cleaned.zarr/"))` opened 275,056 × 24,740 in 0.7 s (X is a dask `Array`); one gene column came over HTTP in 41.7 s. Code only, and needs optional packages (fsspec, aiohttp, xarray, dask) that a plain scanpy install lacks. *Steps:* script block m06 *Evidence:* observation  Also checked 2026-10-04 against public, **anonymous** stores with no credentials ([`demos/remote/anndata_remote.py`](demos/remote/anndata_remote.py); anndata 0.13.4, zarr 3.4.0, s3fs/gcsfs): `s3://lamindata/.lamindb/CFcQxNjzSRzWZrVh.anndata.zarr` (46,086 x 21,972), lazy open 24.5 s, one gene 5.2 s; `gs://vitessce-demo-data/habib-2017/habib17.processed.h5ad.zarr` (13,067 x 25,587), lazy open 5.5 s, one gene 0.2 s. Code only, so P holds.

      **Source and docs.** `read_lazy` with `zarr.storage.FsspecStore` / `ObjectStore`: `anndata/docs/tutorials/zarr-v3.md#L29-L38`; tutorial reads `https://vitessce-demo-data.storage.googleapis.com/anndata-demos/BALF_VIB-UGent_processed_cleaned.zarr/` lazily (read_lazy tutorial above). `read_zarr(store)` also accepts any store/MutableMapping: `anndata/src/anndata/_io/zarr.py#L151`. Seurat/BPCells: no remote reader found (BPCells docs searched for S3/cloud/remote/HTTP, only `remotes::install_github` hits). P on the strength of anndata.
