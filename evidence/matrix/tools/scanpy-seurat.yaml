    detail: |-
      **Checked in the running app (2026-10-04).** bm_demo has no varp, so the paper's spatial demo (`data/spatial_demo.zarr`, varp `spearman_hvg`, 2000 × 2000) was used: the row for `Mbp` drawn as a bar axis; top partners `Mobp`, `Plp1`, `Mal` (oligodendrocyte genes, as expected). Code only. *Steps:* script block m02 *Evidence:* [screens/scanpy-seurat/m02_varp_row_as_axis.jpg](screens/scanpy-seurat/m02_varp_row_as_axis.jpg)

      **Source and docs.** Scanpy: `adata.varp` row into a `var` column, then plotted with matplotlib or `sc.pl.scatter`. Seurat has no gene × gene slot (graphs are cell × cell; `misc` is free-form), so this is Scanpy-only and by code.
