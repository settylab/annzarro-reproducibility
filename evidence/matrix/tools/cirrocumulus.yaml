  de:
    mark: Y
    reason: >-
      ANALYZE > Differential Expression runs a Welch t-test on the server and lists the top features per
      group.
    detail: |-
      **Checked in the running app (2026-10-04).** ANALYZE > Differential Expression, Compare "One vs. Rest", Metadata Categories `Age`, GO, name the job, Submit. Results tab: `matrix_check_age_one_vs_rest`, a dot plot of the top features per group (29 of 16,285 features shown, e.g. Eps8l1, Gdf3, H2-Q7, B2m, Banp, Hmga2, Hsph1). The result was saved as `_data/results/<uuid>.json.gz` (558,696 bytes). *Steps:* As described; wait about 20 s; open the Results tab and click the job. *Evidence:* [m10](screens/cirrocumulus/m10_de_results.jpg)

      **Source and docs.** A Welch t-test on the server ([diff_exp.py#L139](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/diff_exp.py#L139)). The docs show "Run differential expression analysis" ([documentation.rst L129-139](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/docs/documentation.rst#L129-L139)). It is gated by `SERVER_CAPABILITY_JOBS` ([src/JobPanel.js#L207](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/JobPanel.js#L207)), so it is **off in static mode**.
