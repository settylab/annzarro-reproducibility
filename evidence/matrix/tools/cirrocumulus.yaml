  lazy:
    mark: Y
    reason: >-
      Prepared data (cirro prepare_data: zarr, parquet or jsonl) are read one feature at a time; `cirro
      launch` on a plain h5ad holds it in memory. A preparation step counts under reading B, so Y.
    detail: |-
      **Checked in the running app (2026-10-04).** Adding Mpo sends one POST `/api/data` for that feature. In `cirro launch` on an h5ad the server holds the whole AnnData in memory, so this is per-feature transfer, not lazy disk reads. Lazy reads need a `prepare_data` zarr or parquet dataset, which I did not build here. *Steps:* Network tab while adding a gene. *Evidence:* Observation (request log in matrix_check.py output)

      **Source and docs.** Applies to prepared data. `prepare_data` output "allows efficient partial dataset retrieval over a network ... using limited memory" ([docs/installation.rst L147-148](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/docs/installation.rst#L147-L148)). Zarr is read one gene at a time ([zarr_dataset.py#L22-L23](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/zarr_dataset.py#L22-L23)) and Parquet one file per key ([parquet_dataset.py#L67-L68](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/parquet_dataset.py#L67-L68)). In static mode the browser fetches one key at a time with HTTP Range requests ([src/DirectAccessDataset.js#L33-L50](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/DirectAccessDataset.js#L33-L50)). **Caveat:** `cirro launch x.h5ad` reads the whole h5ad into server memory, because `AnndataDataset()` is built without `backed` ([launch.py#L42](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/launch.py#L42); [anndata_dataset.py#L114-L128](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/anndata_dataset.py#L114-L128), [#L185-L192](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/anndata_dataset.py#L185-L192)).

      **Scale group.** **It depends on the mode.** (a) `cirro launch file.h5ad`: the whole AnnData lives in **server** memory (X converted to CSC), and the browser fetches per-feature columns over the REST API. (b) A prepared zarr or parquet dataset: the server reads one gene or key at a time. (c) Static site: the **browser** fetches one key at a time with HTTP Range from a single JSONL file. In every mode the browser holds the full per-cell vectors (coordinates and each viewed feature) for all n cells. Evidence: [launch.py#L42](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/launch.py#L42), [anndata_dataset.py#L185-L192](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/anndata_dataset.py#L185-L192), [zarr_dataset.py#L22-L23](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/zarr_dataset.py#L22-L23), [DirectAccessDataset.js#L33-L80](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/DirectAccessDataset.js#L33-L80)

      Qualified by evidence-curator's gap capture (2026-10-04, shot g05, evidence/screens/gaps/cirro_audit_launch.py): on a `prepare_data --format zarr` copy of the demo, `cirro launch` opened every chunk of X/data and X/indices (129 each) and layers/counts (263) while the dataset loaded, and later gene requests opened no file. Called directly, ZarrDataset.read_dataset reads one gene from 2 of 128 data chunks (cirro_reader_check.py). The reader is lazy (reading B: Y); launch mode loads the whole matrix (reading A: N or P). Static and serve modes were not tested.

      Ruled by comparison-auditor (ccdc64c, 2026-10-04): Y under the 'can' reading (B), N under the 'by default' reading (A). The mark shown follows columns.yaml scored_under for lazy (B).
