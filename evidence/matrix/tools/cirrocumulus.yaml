      **Scale group.** **Partial.** The user can select or filter cells (lasso, brush, value filters) and dim or shrink the rest with the "unselected" opacity and point-size controls ([src/SideBar.js#L103](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/SideBar.js#L103)). Selected cell ids can be downloaded for subsetting in Python ([documentation.rst L110-115](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/docs/documentation.rst#L110-L115)). There is no subset-and-recompute, no downsample slider and no "show only selection" view. Evidence: grep `subset\|downsample\|sample` in `src/`: none relevant

