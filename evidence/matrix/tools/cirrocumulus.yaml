  filters:
    mark: Y
    reason: >-
      Legend clicks and value filters become filter chips, combinable with AND/OR, that dim the other
      cells in every gallery chart.
    detail: |-
      **Checked in the running app (2026-10-04).** Clicking `Young` in the Age legend adds a filter chip "Age" under FILTERS, and the header reads "2,917 / 8,090 cells". All gallery charts dim the other cells. An AND/OR "Combine" switch sits above the chips. (I did not get a second chip in the run.) *Steps:* Cell Metadata > add Age; click the Age gallery chart; click `Young` in the legend. *Evidence:* [m08](screens/cirrocumulus/m08_filters_age_young_chip.jpg)

      **Source and docs.** Saved AND/OR filters, with provenance kept ([documentation.rst L107-L110](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/docs/documentation.rst#L107-L110)). Distribution plots get a "(selection)" panel computed on the filtered cells ([src/DistributionGroup.js#L330-L343](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/DistributionGroup.js#L330-L343)). The filters live in the embedding legend and side bar, not in a data table.
