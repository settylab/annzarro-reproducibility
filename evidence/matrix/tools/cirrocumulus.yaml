    detail: |-
      **Checked in the running app (2026-10-04).** Right-click on `Monocyte` in the highres_celltype legend > Annotate > `Monocyte_matrixcheck` > OK renames the category in the legend. The server wrote `_data/bm_demo.json` (209 bytes, `"categories": {"highres_celltype": {"Monocyte": {..., "new": "Monocyte_matrixcheck"}}}`). *Steps:* As described; then `cat $DEMO_ROOT/_data/bm_demo.json` (delete it afterwards to restore the demo). *Evidence:* [m09](screens/cirrocumulus/m09_annotation_legend_renamed.jpg)

      **Source and docs.** "Collaboratively annotate cell types in real time" ([README.rst L15](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/README.rst#L15)) and the annotate GIF ([documentation.rst L44-46](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/docs/documentation.rst#L44-L46)). This is gated by `SERVER_CAPABILITY_RENAME_CATEGORIES`, which is on by default ([abstract_db.py#L23-L24](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/abstract_db.py#L23-L24); [src/actions/index.js#L1011](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/actions/index.js#L1011)). It is **off in static mode**: there the capability set is empty ([actions/index.js#L195-L196](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/actions/index.js#L195-L196)).
