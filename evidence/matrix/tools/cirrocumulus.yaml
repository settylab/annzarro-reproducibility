  every_cell:
    mark: Y
    reason: The scatter-gl embedding is given every cell's coordinates; no user-facing downsampling exists.
    detail: >-
      **Scale group.** **Every cell is drawn.** The main embedding is a vendored scatter-gl (three.js
      WebGL sprites) given the full coordinate arrays ([src/ThreeUtil.js#L1-L6](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/ThreeUtil.js#L1-L6)).
      A client-side 2D binning ("density") path exists ([src/util.js#L316-L352](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/util.js#L316-L352),
      used at [actions/index.js#L2432](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/src/actions/index.js#L2432)
      when `embedding.mode` is set). I found no UI that sets `embedding.mode`, and the server-side binning
      that the Cumulus paper describes is commented out ([data_processing.py#L448-L450](https://github.com/lilab-bcb/cirrocumulus/blob/cae75c9a2dd164dda07eaae5693e28ea0408f8b2/cirrocumulus/data_processing.py#L448-L450)).
      So there is no documented, user-facing downsampling. Evidence: grep `embedding.mode`, `nbins`, `density`
      in `src/` and `cirrocumulus/`
