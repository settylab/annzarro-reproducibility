  de:
    reason: >-
      Markers for any cluster, lasso selection or versus pair are computed in the browser, in analysis
      and explore modes.
    detail: |-
      **Checked in the running app (2026-10-04).** Choosing annotation `highres_celltype` and cluster `HSC` in the Markers panel recomputes the marker table in the browser (Cavin2, Lmo2, Car2, Mecom, ...). *Steps:* Markers panel: "Choose annotation" → highres_celltype; "Select Cluster" → HSC. *Evidence:* [m10](screens/kana/m10_de_markers_HSC_vs_rest.jpg)

      **Source and docs.** Markers for every cluster, for any lasso selection and for "versus" pairs are computed in the browser, in both analysis and explore modes (README L48; [wiki How-to-interactively-explore-results](https://github.com/kanaverse/kana/wiki/How-to-interactively-explore-results), "Find Markers for Custom Selections", "Versus Mode"; [K/src/workers/explorer.worker.js#L336](https://github.com/kanaverse/kana/blob/ecb0360c5e00200ed9cee2d73d45725e93d53a39/src/workers/explorer.worker.js#L336), [#L460](https://github.com/kanaverse/kana/blob/ecb0360c5e00200ed9cee2d73d45725e93d53a39/src/workers/explorer.worker.js#L460)).
