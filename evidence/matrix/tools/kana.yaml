    reason: An obsm['spatial'] key is drawn as one more embedding tab (x/y), with nothing spatial-aware,
      so P.
    detail: |-
      **Checked in the running app (2026-10-04).** With `obsm['spatial']` present, Kana adds a `spatial` tab next to `X_umap` etc. and draws the grid as x/y, coloured like any embedding. Nothing is spatial-aware (no image, no spot size, no tissue layout). Confirms the code inference. *Steps:* Explore `bm_spatial_test.h5ad`; click tab `spatial`. *Evidence:* [m07](screens/kana/m07_spatial_obsm_spatial_plotted_as_embedding.jpg)

      **Source and docs.** Not documented. Explore mode lists every `obsm` dataset as an embedding ([B/src/readers/h5ad.js#L617-L623](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/h5ad.js#L617-L623), loaded at [#L705-L718](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/h5ad.js#L705-L718)), so an `obsm['spatial']` should plot as x/y. Inferred from code, not observed; N is also defensible since nothing is spatial-aware.
