  lazy:
    reason: >-
      A local file is read whole into the WebAssembly heap and the matrix loaded whole; explore mode does
      the same.
    detail: |-
      **Checked in the running app (2026-10-04).** Observation: the 356 MB file is read in the browser before "Explore" (about 10 s after the file input, then about 4 s to the first plot); no network request carries data (hosts contacted all session: `www.kanaverse.org` 143 static requests, `static.cloudflareinsights.com` 6, `cors-proxy.aaron-lun.workers.dev` 15 for the ExperimentHub list). With nothing fetched over the network, laziness cannot be shown in a network log; the whole-file read is in code ([B/src/readers/abstract/file_web.js#L27-L31](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/abstract/file_web.js#L27-L31)). *Steps:* Load with DevTools Network open. *Evidence:* observation + code

      **Source and docs.** A local file is read whole with `FileReaderSync.readAsArrayBuffer` ([B/src/readers/abstract/file_web.js#L27-L31](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/abstract/file_web.js#L27-L31)), copied into the Wasm file system by `scran.realizeFile` ([B/src/readers/h5ad.js#L256](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/h5ad.js#L256)), then the whole matrix is loaded as a sparse matrix ([#L143-L145](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/h5ad.js#L143-L145)). Explore mode does the same: `dataset = await v.load()` then gene rows come from the in-memory matrix ([K/src/workers/explorer.worker.js#L219](https://github.com/kanaverse/kana/blob/ecb0360c5e00200ed9cee2d73d45725e93d53a39/src/workers/explorer.worker.js#L219), [#L442](https://github.com/kanaverse/kana/blob/ecb0360c5e00200ed9cee2d73d45725e93d53a39/src/workers/explorer.worker.js#L442)). Side note: the separate prototype [kanaverse/wobbegong-kana](https://github.com/kanaverse/wobbegong-kana) (`22368fa`, 2025-05-30, no release, ships a `server.js`) reads SummarizedExperiment parts via HTTP range requests; it is not part of Kana.

      **Scale group.** **Everything is held whole in browser memory, inside the WebAssembly heap of a Web Worker.** The file is read whole, then the count matrix is loaded whole as a "layered" sparse matrix (about 3 bytes per non-zero). The deployed build caps the heap at **4 GiB**: its memory import is shared, 32-bit and max 65,536 pages. scran.js v4.1.0 moved to 64-bit Wasm with a 16 GB cap, not supported on Safari, but the live Kana build has not picked that up. Evidence: [B/src/readers/abstract/file_web.js#L27-L31](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/abstract/file_web.js#L27-L31); [KP/main.tex#L274-L281](https://github.com/kanaverse/kana-paper/blob/220a3d64fa7f721dc8d14b98afb16cf2672a1fee/main.tex#L274-L281); [S/CMakeLists.txt#L128-L131](https://github.com/kanaverse/scran.js/blob/b6dacf5bf06d7a870ea78d0777665d32fdf1347f/CMakeLists.txt#L128-L131); [S/NEWS.md#L5-L6](https://github.com/kanaverse/scran.js/blob/b6dacf5bf06d7a870ea78d0777665d32fdf1347f/NEWS.md#L5-L6). I checked the deployed heap limit by parsing the live `.wasm` import section (validation step 7 below).
