  remote:
    reason: >-
      Only a fixed list of 8 curated datasets loads remotely, each downloaded whole; there is no field
      for a user URL, S3 or GCS path, so P.
    detail: |-
      **Checked in the running app (2026-10-04).** New Analysis sources: ExperimentHub (a fixed list of 8 curated datasets), 10X MatrixMarket, 10X HDF5, H5AD, RDS, ZIP. The H5AD tab has one `input[type=file]` and no URL field. *Steps:* "I want to analyze a new dataset"; read the left tab list; click H5AD. *Evidence:* [m06 tabs](screens/kana/m06_remote_new_analysis_tabs.jpg), [m06 H5AD](screens/kana/m06_remote_h5ad_tab_file_only.jpg)

      **Source and docs.** Only the 8 hard-coded gypsum datasets load remotely, and each file is downloaded whole into an IndexedDB cache before use ([K/src/workers/helpers.js#L8-L11](https://github.com/kanaverse/kana/blob/ecb0360c5e00200ed9cee2d73d45725e93d53a39/src/workers/helpers.js#L8-L11)). There is no field for a user URL, S3 or GCS path: the New Analysis tabs are ExperimentHub, Matrix Market, 10X HDF5, H5AD, RDS (SE/SCE) and zipped ArtifactDB ([K/src/components/NewAnalysis/](https://github.com/kanaverse/kana/tree/ecb0360c5e00200ed9cee2d73d45725e93d53a39/src/components/NewAnalysis)).
