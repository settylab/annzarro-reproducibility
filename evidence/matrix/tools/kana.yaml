  focus:
    reason: >-
      Kana reads no pairwise matrix, and its only focus is a gene colouring the single live embedding,
      which the strict definition excludes.
    detail: |-
      **Focus, checked in the running app.** Kana reads no obsp or varp, and its only focus is (a2) gene colouring of the single live embedding, which is N by definition.

      **Source and docs.** Clicking a gene's droplet icon in the marker table recolours the embedding by that gene, and choosing a cluster re-drives the marker table ([K/README.md#L64](https://github.com/kanaverse/kana/blob/ecb0360c5e00200ed9cee2d73d45725e93d53a39/README.md#L64)). That is the same "colour by gene" behaviour CELLxGENE has and is scored N; there is no single-cell focus. Upgrade to P only if the author counts gene → embedding recolouring.
