  cells:
    reason: >-
      The readers open X/layers, obs, var and obsm only; the embedding tabs list obsm keys and the colour
      list obs columns, with no obsp anywhere.
    detail: |-
      **Checked in the running app (2026-10-04).** The embedding tabs are the four obsm keys; the colour-by list holds the 13 obs columns (Age, Compartment, Replicate, Sample, fig3_diffusion_dist_to_plasma, highres_celltype, kompot_da_Young_to_Old_lfc, leiden, midres_celltype, n_genes_by_counts, pct_counts_mt, phase, total_counts). `connectivities`, `distances` and `diffusion_distance` appear nowhere. *Steps:* Load; read the tabs above the plot and the "Choose annotation" options. *Evidence:* [m04 tabs](screens/kana/m04_slots_tabs_and_annotation_list.jpg)

      **Source and docs.** The H5AD reader opens only `X`, `layers`, `obs`, `var` and `obsm` ([B/src/readers/h5ad.js#L38-L50](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/h5ad.js#L38-L50), [#L617-L623](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/h5ad.js#L617-L623)); `grep -rn obsp bakana/src kana/src` finds nothing. The SE reader handles `reducedDims` and `altExps`, not `colPairs` ([B/src/readers/se.js#L391](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/se.js#L391), [#L472](https://github.com/kanaverse/bakana/blob/299c4da177d16451e92a32f31ae2db1eb31db617/src/readers/se.js#L472)). The SNN graph is computed internally but never shown as a colour.
