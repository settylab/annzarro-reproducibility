  slots:
    mark: P
    reason: >-
      Loaders read X, layers, obs, var and obsm named in a view config; obsp, varp and varm cannot be
      loaded, so P.
    detail: |-
      **Checked in the running app (2026-10-04).** There is no slot browser in the GUI: what is shown is what the view config names (`obsm/X_umap`, `obsm/X_draw_graph_fa`, three obs columns, `X`). Layers can be named in a config; obsp, varp and varm cannot (no loader). Nothing to screenshot beyond column 1. *Evidence:* [m00](screens/vitessce/m00_plots_render.jpg)

      **Source and docs.** Loaders read X, layers, obs, var, obsm, uns (comparison metadata) ([`file-def-options.ts#L427-L448`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/schemas/src/file-def-options.ts#L427-L448), the anndata.zarr options; [`base-plugins.ts#L317-L334`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/main/all/src/base-plugins.ts#L317-L334), the AnnData file types and their loaders); none read `obsp`, `varp` or `varm`.
