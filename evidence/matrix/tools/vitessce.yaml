cells:
  cells:
    mark: N
    reason: >-
      Vitessce has no obsp data type or loader; Cell Sets lists the configured obs columns only, though
      the store holds three obsp matrices.
    detail: |-
      **Checked in the running app (2026-10-04).** Cell Sets lists only the configured obs columns (Cell type, Age, Sample); the Gene List lists var names. Nothing offers `connectivities`, `distances` or `diffusion_distance`, although the store has them under `obsp/`. *Steps:* Open `https://vitessce.io/#?url=http://127.0.0.1:8904/config.json`. *Evidence:* [m00](screens/vitessce/m00_plots_render.jpg), [Focus 01](screens/vitessce/01_loaded.jpg)

      **Source and docs.** No `obsp` data type or loader. Data types: [`packages/constants-internal/src/constants.ts#L41-L62`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/constants-internal/src/constants.ts#L41-L62) (no pairwise type; `sampleEdges` is an obs to sample mapping, [`SampleEdgesAnndataLoader.js#L26-L36`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/file-types/zarr/src/anndata-loaders/SampleEdgesAnndataLoader.js#L26-L36)). `grep -rE "obsp\|varp\|obsPairs" packages` hits only test fixtures. Pointing the matrix loader's `path` at `obsp/...` does not work: feature names come from `var` ([`ObsFeatureMatrixAnndataLoader.js#L130-L140`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/file-types/zarr/src/anndata-loaders/ObsFeatureMatrixAnndataLoader.js#L130-L140)), so an n_obs × n_obs matrix has no matching labels. Python `AnnDataWrapper` takes no obsp argument ([PY `src/vitessce/wrappers.py#L1196`](https://github.com/vitessce/vitessce-python/blob/1fdcf8a238a5e22cdfad21ef2f679c03154f000c/src/vitessce/wrappers.py#L1196)).
