  annot:
    mark: P
    reason: >-
      A lasso creates a renamable cell set that lives in the view state and exported JSON/CSV files, but
      nothing is written back to the data, so P.
    detail: |-
      **Checked in the running app (2026-10-04).** A lasso on the UMAP creates "My Selections" > "Selection 1" (the other cells are greyed, and the Cell Set Sizes bar shows about 2,200 cells). The set's menu offers Rename, Delete, Export hierarchy (to JSON file), Export hierarchy (to CSV file). The set lives in view state and in exported files; the store is not written. P holds. *Steps:* `config_matrix.json`; click the lasso button in the UMAP toolbar; draw around the top (neutrophil) arm; in Cell Sets click the three dots next to "My Selections". *Evidence:* [lasso](screens/vitessce/m09_annotation_lasso_creates_set.jpg), [menu](screens/vitessce/m09_annotation_set_menu.jpg)

      **Source and docs.** User cell sets: create from lasso, import, download JSON/CSV ([`obs-sets-manager/src/ObsSetsManagerSubscriber.js#L496-L595`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/obs-sets-manager/src/ObsSetsManagerSubscriber.js#L496-L595)); held in view state, not written back to the store.
