  focus:
    mark: N
    reason: >-
      The only focus is a gene's expression column propagating to every coordinated view, which the strict
      definition excludes; no pairwise row can be chosen or drawn.
    detail: |-
      **Focus, checked in the running app.** The only focus Vitessce has is (a2), a gene's expression column propagating to every coordinated view, which by the strict definition is N; no cell x cell or gene x gene row can be chosen or drawn.

      **Source and docs.** Under the loose definition: One selected gene re-drives every coordinated view: clicking a row of the feature statistics table sets `featureSelection` ([`statistical-plots/src/FeatureStatsTable.js#L101-L107`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/statistical-plots/src/FeatureStatsTable.js#L101-L107)), as do the gene list ([`feature-list/src/FeatureListSubscriber.js#L79`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/feature-list/src/FeatureListSubscriber.js#L79)) and a volcano click ([`VolcanoPlotSubscriber.js#L123`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/statistical-plots/src/VolcanoPlotSubscriber.js#L123)); the embedding ([`EmbeddingScatterplotSubscriber.js#L110`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/scatterplot-embedding/src/EmbeddingScatterplotSubscriber.js#L110)), spatial ([`SpatialSubscriber.js#L107`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/spatial/src/SpatialSubscriber.js#L107)) and violin plot ([`CellSetExpressionPlotSubscriber.js#L162`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/statistical-plots/src/CellSetExpressionPlotSubscriber.js#L162)) read it. This is the same behaviour iSEE gets P for ("table row click changes plotted gene"). Not Y: a focused *cell* only produces a transient hover highlight (`obsHighlight`), and no focused entity pulls a relationship row. Demo: Habib 2017, click a gene in the gene list, the UMAP recolours.
