  lazy:
    mark: Y
    reason: >-
      Per-gene zarr chunks are fetched on demand (one 146 kB chunk for Mpo), but views such as the heatmap
      load the whole X at startup, so Y with a caveat.
    detail: |-
      **Checked in the running app (2026-10-04).** Store X is dense zarr with chunks [8090, 10] (1,629 chunk files, 247 MB). With `config_lazy.json` (UMAP and gene list only), loading fetches **no** X chunk; clicking Mpo fetches `X/.zattrs`, `X/.zarray` and one chunk, `X/0.1041` (146,492 bytes). With `config.json` (heatmap) or `config_matrix.json` (Vega views; I did not isolate which of the three triggers it), the app fetches **all 1,631 X files at load**, i.e. the whole matrix. Lazy per-gene reads hold only when no view needs the full matrix. *Steps:* Network tab, or the request log in matrix_check2.py / matrix_check3.py output. *Evidence:* [m05](screens/vitessce/m05_lazy_scatter_genelist_mpo.jpg) plus request log

      **Source and docs.** Per-gene reads from csc or column-chunked dense X ([docs "chunking strategy" and "sparse matrices"](https://vitessce.io/docs/data-troubleshooting/), source [`sites/docs/docs/data-troubleshooting.md#L66-L84`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/sites/docs/docs/data-troubleshooting.md#L66-L84)); `loadGeneSelection` in [`ObsFeatureMatrixAnndataLoader.js#L556`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/file-types/zarr/src/anndata-loaders/ObsFeatureMatrixAnndataLoader.js#L555). Tiled spatial points via SpatialData ([blog](https://vitessce.io/blog/spatial-elements/), 200).

      **Scale group.** **Lazy, in the browser; no server process.** Expression is fetched per gene by HTTP range from chunked zarr; the embedding (obsm) and the obs columns used are read whole into browser memory. The full-matrix heatmap path checks a ~2 GB browser allocation budget and throws `MatrixTooLargeError` rather than stalling. Evidence: [`ObsEmbeddingAnndataLoader.js#L23`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/file-types/zarr/src/anndata-loaders/ObsEmbeddingAnndataLoader.js#L23); [`ObsFeatureMatrixAnndataLoader.js#L46-L47`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/file-types/zarr/src/anndata-loaders/ObsFeatureMatrixAnndataLoader.js#L46-L47), [L519-L550](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/file-types/zarr/src/anndata-loaders/ObsFeatureMatrixAnndataLoader.js#L519-L550); [docs](https://vitessce.io/docs/data-troubleshooting/) (source L66-L84).
