retired_cells:
  filters:
    mark: P
    reason: >-
      Unticking a cell set restricts the statistical views and greys those cells in the embeddings, but
      there is no table and greyed cells stay drawn, so P.
    detail: |-
      **Checked in the running app (2026-10-04).** Unchecking one cell type in Cell Sets removes it from every view (heatmap "with 8,050 cells selected"), but cells are greyed rather than hidden, and there is no table. Shown in the Focus section. *Steps:* Expand "Cell type" in Cell Sets and untick a type. *Evidence:* [Focus 04](screens/vitessce/04_cellset_uncheck_CD4_both_views.jpg)

      **Source and docs.** Cell-set selection (`obsSetSelection`) restricts the statistical plots and colours the embedding, but unselected cells stay drawn in grey behind the selected ones ([`EmbeddingScatterplotSubscriber.js#L447-L450`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/scatterplot-embedding/src/EmbeddingScatterplotSubscriber.js#L447-L450), [`gl/src/SelectionExtension/shader-module.js#L7`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/gl/src/SelectionExtension/shader-module.js#L7)). The `obsFilter` prop reaches the scatterplot but is commented out there ([`scatterplot/src/Scatterplot.js#L277`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/scatterplot/src/Scatterplot.js#L277)). No row table with filter conditions.
