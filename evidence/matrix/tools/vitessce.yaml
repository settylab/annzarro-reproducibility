  subset:
    mark: N
    reason: No GUI control picks a subset; cell sets only highlight.
    detail: |-
      **Scale group.** **No cell subset in the GUI** (highlight only). Selecting cell sets colours them and draws the rest in grey behind; there is no "hide others", subset-and-recompute or sample slider. The only subsetting is author-side config: `initialFeatureFilterPath`/`featureFilterPath` restrict genes, and an author can point the matrix `path` at a smaller array. Call it N for cells; a reviewer could argue P via cell-set selection driving the statistical plots. Evidence: [`EmbeddingScatterplotSubscriber.js#L447-L450`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/scatterplot-embedding/src/EmbeddingScatterplotSubscriber.js#L447-L450); [`shader-module.js#L7`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/gl/src/SelectionExtension/shader-module.js#L7) (unselected points pushed behind, not discarded); `obsFilter` unused at [`Scatterplot.js#L277`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/scatterplot/src/Scatterplot.js#L277); docs "Use or Store a subset of X" (source L100-L120).

