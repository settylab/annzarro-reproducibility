  every_cell:
    mark: Y
    reason: >-
      The embedding is one deck.gl ScatterplotLayer over every cell; density contours are an optional
      overlay, not a downsample.
    detail: >-
      **Scale group.** **All cells drawn.** The embedding is one deck.gl `ScatterplotLayer` whose data
      length is the full embedding (`obsEmbedding.shape[1]`); no downsampling or binning of points. An
      optional per-cell-set **density contour** overlay exists (`embeddingContoursVisible`, percentiles
      0.09/0.9/0.99), and points can be switched off to show contours only. Spatial transcript points
      (SpatialData) are tiled by viewport, not all at once. Heatmap: full n_obs × n_vars matrix, with
      a documented allocation-budget error and "load a subset" advice. Evidence: [`scatterplot/src/Scatterplot.js#L292`](https://github.com/vitessce/vitessce/blob/fed6719970740e1930f3e495bc0ef5855b49ab08/packages/view-types/scatterplot/src/Scatterplot.js#L292),
