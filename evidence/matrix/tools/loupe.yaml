  lazy:
    reason: >-
      Measured in the app (2026-10-08, Loupe Browser 9.1.0): the same 1,000,000 cells as a 200-gene (0.366 GiB) and a
      2,000-gene (2.201 GiB) .cloupe, three fresh starts each. The memory after opening was the same, a median of 1.273
      and 1.272 GiB, so the expression matrix is not loaded whole on opening.
    detail: |-
      **Checked in the running app (2026-10-08, Loupe Browser 9.1.0, two .cloupe files with the same 1,000,000 Tahoe-100M cells).** The files differ only in genes, 200 against 2,000 (393,358,341 and 2,363,578,797 bytes, 6-fold; 101.5 and 589.0 stored values per cell), and were built with LoupeR from the same h5ad inputs (`benchmark/tool_ceiling/lazy_loupe/inputs/`). Each file was opened three times, each in a freshly started app; memmon sampled the physical footprint of Loupe's whole process tree (macOS phys_footprint, what Activity Monitor calls Memory) every 2 s. The footprint after opening (last sample before the marker written about 10 s after the plot was drawn): g200 1.134, 1.273, 1.281 GiB, g2000 1.095, 1.272, 1.280 GiB; medians 1.273 and 1.272 GiB, difference -0.001 GiB, against 1.835 GiB of file-size difference. The rule fixed before the run (Y below 10% of the file-size difference, N from 50%) gives Y; the largest spread between the three repetitions of one file, 0.185 GiB, is about as large as the Y threshold (0.183 GiB), and the difference of the medians is far inside it. Coloring by cell_line_id left the footprint within -0.10 to +0.00 GiB of the opened value; coloring by MALAT1 raised the footprint by 0.09 to 0.34 GiB for both files, with no pattern by file. The peak while loading was 2.0 to 2.2 GiB for both files. Source: `benchmark/tool_ceiling/lazy_loupe/partD/readout.txt`, `lazy_results.csv`.

      **What Y means here, and what it does not.** Memory after opening does not grow with the expression matrix at 1 million cells, so Loupe does not load the matrix whole on opening. That is not documented by 10x and the format is closed, so how Loupe reads the file (chunks, memory mapping, an index) was not established, and nothing was measured above 1 million cells or for other gene counts. Marked Y under reading B (what the GUI can do).

      **Loupe showed 999,966 barcodes, not 1,000,000.** Both inputs hold 1,000,000 cells with unique names and the build log reports 1,000,000 cells. In both, exactly 34 cells have no MALAT1 count, and 1,000,000 - 34 = 999,966, so the legend under the gene coloring counts the cells with a nonzero value of the colored gene (not tested with another gene; the count under the cell_line_id coloring was not recorded). `benchmark/tool_ceiling/lazy_loupe/inputs/barcode_check.txt`.

      **Deviations from the protocol (record.txt).** The markers, memmon and the record were run from Bash, because computer use cannot type into Terminal, so marker times lag the visual moment by seconds. Screenshots came from the desktop app's capture, not screencapture. The file was opened by path entry (Cmd+Shift+G) in the Open panel. g200 repetition 1 waited 470 s for the lock; in g2000 repetition 1 the gene marker came about 43 s after the cell-line marker (focus went to Finder, the steps were redone); g200 repetition 3 loaded slowly (10 to 18 s) and its memory trace has only 9 samples (memmon was starved), so its opened value is the sample 14 s before the marker.

      **Documentation (secondary, 2026-10-04).** Not run at the time; closed format, docs silent. Only hint: 16 GB RAM minimum vs a 7.7 GB HD tutorial file. *Steps:* [Download Center](https://www.10xgenomics.com/support/software/loupe-browser/downloads), Cmd-F "16GB". *Evidence:* [docs m05](screens/loupe/m05_lazy_DOCS_system_requirements.jpg) (requirements only)

      **Source and docs.** The `.cloupe` format and loader are closed. The docs give no statement either way.

      **Scale group.** Not documented; closed format. Everything runs in the local desktop process. Requirements: 16 GB RAM minimum, SSD "highly recommended", and for "large single cell datasets (100k+ cells), 16GB RAM and a quad core processor are highly recommended". Evidence: [Download Center, System Requirements / Performance Notes](https://www.10xgenomics.com/support/software/loupe-browser/downloads)
    evidence:
