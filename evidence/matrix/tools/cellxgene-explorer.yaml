    reason: >-
      Neither Annotate nor Explorer offers any obsp matrix; the layout menu lists obsm embeddings and
      the side panel obs columns only.
    detail: |-
      **Checked in the running app (2026-10-04).** Neither program lists `obsp` anywhere. Annotate's embedding menu offers only `diffusion`, `draw_graph_fa`, `pca`, `umap`; the left panel has only obs columns. *Steps:* Annotate: click the layout button at the bottom left ("umap: 8090 out of 8090 cells"). *Evidence:* [m04 Annotate layouts](screens/cellxgene/m04_slots_annotate_layout_menu.jpg)

      **Source and docs.** Neither server serves `obsp`. Annotate exposes X, obs, var and `obsm["X_*"]` only ([A/server/data_anndata/anndata_adaptor.py#L299-L309](https://github.com/chanzuckerberg/cellxgene/blob/fd8b47b78ed9f9fa3ac9bb52897597a3e7fa549a/server/data_anndata/anndata_adaptor.py#L299-L309)); Explorer's `.cxg` has X, obs, var, emb, uns (grep `obsp\|varp\|varm` in `E/server`: no hits).
