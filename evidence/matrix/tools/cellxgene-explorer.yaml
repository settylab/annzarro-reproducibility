      **Focus, checked in the running app.** both programs. Nothing can be focused: a cell click does nothing, and a gene is feature colouring. That gene colouring does reach a second view (the scatterplot or the side panel), which is (a2) and does not count for this column.

      **Source and docs.** Choosing a gene recolours the embedding(s) and opens an NCBI info card; no second plot is re-driven by a focused cell or gene. Explorer can show two embeddings side by side (`E/client/src/reducers/panelEmbedding.ts`), but that is shared colouring and selection, not focus.
