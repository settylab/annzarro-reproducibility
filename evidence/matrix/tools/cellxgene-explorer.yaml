  lazy:
    mark: Y
    reason: >-
      Explorer slices TileDB arrays on S3 per request (one gene column, 20 kB, per gene added); Annotate
      holds the whole h5ad in memory unless started with --backed.
    detail: |-
      **Checked in the running app (2026-10-04).** Explorer: adding MYH7 makes one request, `data/var?var:feature_name=MYH7&nbins=500`. Fetched with curl, `.../api/v0.3/data/var?var:feature_name=MYH7` returns 200 with **20,072 bytes** in 1.06 s: one gene column of the 4,992 x 35,476 matrix. Annotate also sends one `data/var?var:name_0=Mpo` per gene, but its server already holds the whole h5ad in memory (no `--backed` in start.sh), so the lazy part is Explorer's. *Steps:* Browser network tab while adding a gene; or `curl` the URL with the s3_uri prefix (see Demos). *Evidence:* Observation (request log in matrix_check.py output)

      **Source and docs.** Explorer: TileDB arrays on S3, sliced per request (`X.query(...).multi_index[obs_items, var_items]`, [E/server/dataset/cxg_dataset.py#L757-L780](https://github.com/chanzuckerberg/single-cell-explorer/blob/dbbcef32857a44f2f40eaa44b78c27a784e82671/server/dataset/cxg_dataset.py#L757-L780)). Annotate: whole h5ad in memory by default; `--backed` reads it lazily ([A/server/data_anndata/anndata_adaptor.py#L152-L163](https://github.com/chanzuckerberg/cellxgene/blob/fd8b47b78ed9f9fa3ac9bb52897597a3e7fa549a/server/data_anndata/anndata_adaptor.py#L152-L163); default `backed: false`, [A/server/default_config.py#L33](https://github.com/chanzuckerberg/cellxgene/blob/fd8b47b78ed9f9fa3ac9bb52897597a3e7fa549a/server/default_config.py#L33)).

      **Scale group.** **Explorer**: server reads TileDB slices from S3 on demand (lazy, server side); the browser fetches whole columns (embedding, each obs field, each gene) for all cells, at most 32 columns per request, and keeps them. **Annotate**: server process holds the whole h5ad in RAM by default; `--backed` reads X lazily from the h5ad (docs: slower histograms and DE); browser side same as Explorer. Evidence: Explorer `cxg_dataset.py` L757-780; `column_request_max: 32` ([E/server/default_config.py#L83](https://github.com/chanzuckerberg/single-cell-explorer/blob/dbbcef32857a44f2f40eaa44b78c27a784e82671/server/default_config.py#L83)). Annotate `anndata_adaptor.py` L153-164, `default_config.py` L33, `launch.py` L133-138, 5_1 docs ("By default, cellxgene will read the entire H5AD ... into memory at startup").
