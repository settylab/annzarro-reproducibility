      **Checked in the running app (2026-10-04).** Explorer's `/s3_uri` endpoint returns `s3://hosted-cellxgene-prod/...cxg`: reads go to Discover's own bucket only. Annotate was not tried with a URL; the code copies a remote file locally first (Matrix row). *Steps:* `curl .../cellxgene/e/85585f3f-d16a-412d-b93a-406d52721221.cxg/api/v0.3/s3_uri` *Evidence:* Observation

      **Source and docs.** Explorer reads its own S3 bucket lazily ([E/server/dataset/cxg_dataset.py#L33-L37](https://github.com/chanzuckerberg/single-cell-explorer/blob/dbbcef32857a44f2f40eaa44b78c27a784e82671/server/dataset/cxg_dataset.py#L33-L37)), only for `.cxg` produced by the Discover pipeline. Annotate accepts an fsspec URL (s3, gs, http) but copies the file to a temp file and loads it ([A/server/common/utils/data_locator.py#L107-L116](https://github.com/chanzuckerberg/cellxgene/blob/fd8b47b78ed9f9fa3ac9bb52897597a3e7fa549a/server/common/utils/data_locator.py#L107-L116)): remote fetch, not remote reading.
