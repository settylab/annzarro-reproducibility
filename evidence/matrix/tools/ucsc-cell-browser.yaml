  de:
    mark: N
    reason: >-
      DE is off by default and absent on cells.ucsc.edu; with the flag on but no backend the client shows
      placeholder statistics, so the figure's P should be N.
    detail: |-
      **Checked in the running app (2026-10-04).** The Tools menu of the local build has only Custom Annotations..., Set as background cells and Reset background cells; there is no Differential expression item. The source explains why (cellBrowser.js at a11af81). The menu item is behind `cbDeEnabled()`, which reads `showDiffExp` from `cb.conf` and defaults to OFF so that "the still-in-progress DE UI (whose statistics are a placeholder until the compute backend is wired up) does not leak onto installs like cells.ucsc.edu" (L3690-3699). Without a `deUrl`, `deSubmitJob` falls back to "a clearly-labelled client-side placeholder that ... synthesizes statistics" (L14924-14939). The real Wilcoxon backend is a separate, self-hosted Flask app (`src/cbAnnotServer/de`, mounted at `/api/de`). The portal's `cb.conf` sets only `annotApiBase=` and `showLogin=off`, and the portal's live `js/cellBrowser.js` contains no DE code (0 hits for `tpDeMenu` or "Differential expression"). *Steps:* Open the Tools menu; `curl -s https://cells.ucsc.edu/cb.conf`; grep the two files. *Evidence:* [m10](screens/ucsc-cell-browser/m10_de_tools_menu_no_de.jpg)

      **Source and docs.** The paper describes it as a future plan ("we intend to add support for running analysis algorithms on selected cells on-the-fly"), and the running app agrees: DE is off by default and absent on the portal. Older text follows. Wilcoxon test on a server compute backend (`docs/ui/diffexp.rst` L1-8); not available on a plain static deployment. Client UI default `subsample: 5000` per group (`JS/cellBrowser.js` [L14150](https://github.com/ucscGenomeBrowser/cellBrowser/blob/a11af81299cc13dfe1ab7b063f03205b75b13913/src/cbPyLib/cellbrowser/cbWeb/js/cellBrowser.js#L14150)).
