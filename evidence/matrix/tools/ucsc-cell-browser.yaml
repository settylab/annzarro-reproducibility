    detail: |-
      **Checked in the running app (2026-10-04).** Opening `?ds=bm_demo&gene=Mpo` fetches `exprMatrix.json` (index) and then `exprMatrix.bin?Mpo` with `Range: bytes=70955997-70967724`: **11,728 bytes** of a 111,110,566-byte matrix file. Portal: `curl -r 1961463-1963955 .../brain-spatial-omics/p21/exprMatrix.bin` (offsets for Mbp from `exprMatrix.json`) returns 206 with 2,493 bytes of a 199 MB file. *Steps:* Network tab while opening a gene. *Evidence:* Observation (request log in matrix_check.py output)

      **Source and docs.** Per-gene HTTP `Range` requests: `JS/cbData.js` [L192-224](https://github.com/ucscGenomeBrowser/cellBrowser/blob/a11af81299cc13dfe1ab7b063f03205b75b13913/src/cbPyLib/cellbrowser/cbWeb/js/cbData.js#L192); `docs/advanced.rst` L10-13 (server must support byte ranges). Live: 206 on a range read of the 27.8 GB PanSci `exprMatrix.bin`. Note that coordinates and each metadata field are fetched whole.

      **Scale group.** **Lazy, in the browser.** Expression is fetched one gene at a time by HTTP byte range from a static file; nothing loads the whole matrix. Coordinates for the active layout and each viewed metadata field are downloaded whole (174 MB of coordinates for PanSci). Without byte-range support the viewer falls back to full downloads and warns above 30 MB. For datasets above 200,000 cells only the first quick gene is preloaded. Evidence: `JS/cbData.js` [L222-224](https://github.com/ucscGenomeBrowser/cellBrowser/blob/a11af81299cc13dfe1ab7b063f03205b75b13913/src/cbPyLib/cellbrowser/cbWeb/js/cbData.js#L222), [L286-294](https://github.com/ucscGenomeBrowser/cellBrowser/blob/a11af81299cc13dfe1ab7b063f03205b75b13913/src/cbPyLib/cellbrowser/cbWeb/js/cbData.js#L286), [L1231](https://github.com/ucscGenomeBrowser/cellBrowser/blob/a11af81299cc13dfe1ab7b063f03205b75b13913/src/cbPyLib/cellbrowser/cbWeb/js/cbData.js#L1231); `JS/cellBrowser.js` [L10692-10693](https://github.com/ucscGenomeBrowser/cellBrowser/blob/a11af81299cc13dfe1ab7b063f03205b75b13913/src/cbPyLib/cellbrowser/cbWeb/js/cellBrowser.js#L10692).
