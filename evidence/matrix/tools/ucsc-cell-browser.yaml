  remote:
    mark: P
    reason: >-
      The viewer reads its own pre-built directory over HTTP from any web host or bucket, but cannot read
      an h5ad or zarr in place, so P.
    detail: |-
      **Checked in the running app (2026-10-04).** The portal serves the same pre-built files over HTTP (requests above); only the viewer's own format is read. Not tested with an h5ad or zarr in a bucket, which it cannot read. *Evidence:* Observation

      **Source and docs.** The built directory can sit on S3, GCS, Azure or github.io (`docs/internet.rst` L9-13), and the viewer reads it over HTTP. But it reads only its own pre-built format; h5ad or zarr in a bucket are not read in place.
