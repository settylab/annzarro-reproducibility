  spatial:
    mark: Y
    reason: >-
      Spatial positions are an obsm matrix like any embedding, so any two of its columns are a Cell Plot's
      x and y, with an Equal aspect toggle.
    detail: >-
      There is no separate spatial mode: `obsm/spatial` (or any registered coordinates) is chosen in the
      X/Y menus, and **Equal aspect** (`settings.equalAspect`) fixes one unit of x to one unit of y. Shot
      10: the 10x Visium mouse-brain section (2,693 spots, `spatial_demo.zarr`) in tissue coordinates,
      coloured by Leiden cluster. Everything else (obsp kernel rows, focus, table filters) works on top.
