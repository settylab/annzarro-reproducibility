  focus:
    mark: Y
    reason: >-
      One click on a cell (or gene) makes it the focus, and every panel that reads a focused row (obsp,
      varp, a layer row) re-reads and redraws.
    detail: >-
      Clicks call `DataManager.setFocusedCell/Gene` (`plot-make-helper.js`), which dispatches `focusedCellChanged`/`focusedGeneChanged`
      (`data-manager.js`); each Cell Plot re-reads every axis and colour that is an obsp row (or, for
      a gene, a layer column) and each Gene Plot every varp row or layer row (`cell-plot.js`, `gene-plot.js`).
      Shots 04 -> 05: one click on a cell in plot A redraws A (obsp `diffusion_walk_t5` row), B (obsp
      `diffusion_distance` row) and C (genes coloured by the cell's row of the fold-change layer); the
      browser's data requests after the click are listed in the shot's callouts. Shots 02 -> 03: a click
      on a gene redraws both varp panels. This is the strict definition (through the stored pairwise row),
      not feature colouring. Panels whose sources do not depend on the focus only move the focus marker;
      a Lock button pins one axis to its entity.
    evidence:
    - kind: screenshot
      path: evidence/screens/annzarro/04_focus_before_cell_click.png
    - kind: screenshot
      path: evidence/screens/annzarro/05_focus_after_cell_click.png
