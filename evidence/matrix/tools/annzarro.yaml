  selection:
    reason: >-
      A table filter (AND/OR on any obs or var column) restricts every plot linked to that table; there
      is no lasso or box select in plots.
    detail: >-
      Selection in AnnZarro is made in a table, not by brushing a plot: the Plotly toolbar has lasso2d
      and select2d removed (`main.js`, `plot-make.js`). A table's SearchBuilder filter greys or removes
      the other cells in every plot linked to it (shot 07, two plots). A single click focuses one cell
      or gene rather than selecting. Y under 'a selection or filter made in one view restricts the same
      cells in other linked views'; P if the column means plot brushing.
    evidence:
    - kind: screenshot
      path: evidence/screens/annzarro/07_table_filter_masks_linked_plots.png
