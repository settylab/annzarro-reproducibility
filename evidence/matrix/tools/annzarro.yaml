  remote:
    mark: Y
    reason: >-
      The server opens zarr stores from s3://, gs:// and http(s):// URLs through fsspec, chunk by chunk,
      with the optional annzarro[remote] readers.
    detail: >-
      `core/remote.py` maps s3/gs/http(s) to s3fs, gcsfs and aiohttp and opens every remote store through
      `open_remote_group`, under a policy: allowed on a loopback single-user server, only from `remote_allowlist`
      on a hosted one (`config/base.yaml`). Shot 16: the showcase store served by a plain web server on
      127.0.0.1 opens from its http:// URL and is plotted; its log shows only the chunks of one gene column
      fetched. Limits: zarr only (a remote .h5ad is refused), consolidated metadata needed over HTTP,
      not in the desktop app (it ships without the remote readers), 4-7 s to open (docs). S3 and GCS were
      not exercised here (same code path, other fsspec backend). manuscript/body.tex Limitations 'Data
      access' now agrees with this.
