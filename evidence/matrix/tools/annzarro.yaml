retired_cells:
  filters:
    mark: Y
    reason: >-
      A cell or gene table's SearchBuilder filter (AND/OR, nested groups) masks the same cells or genes
      in every plot linked to it.
    detail: >-
      Each plot has a **Filter by Table** menu (`panel-ui-make.js`); a table whose filtered rows change
      notifies its plots (`table-data.js` -> `tableFiltered` -> `panel-manager.js`), which draw the rows
      outside the filter grey or, with the eye button, remove them (`plot-make.js`). The SearchBuilder
      takes conditions joined by AND or OR, nested to depth 2. Shot 07: HSC AND (DA z-score > 2 OR Age
      = Old) on a cell table masks a UMAP and a diffusion-component plot at once.
    evidence:
    - kind: screenshot
      path: evidence/screens/annzarro/07_table_filter_masks_linked_plots.png
    - kind: code
