  annot:
    reason: >-
      Drawn shapes are added to the SpatialData object with Shift+E but only in memory; writing them to
      disk needs code, so P.
    detail: |-
      **Checked in the running app (2026-10-04).** A polygon layer `my_roi`, saved with the Shift+E handler (`_save_to_sdata`), appears as an element in the SpatialData dock, and napari shows "Layer saved". The log says `Annotations only added in memory, please manually save to disk.`; the store's `shapes/` directory was unchanged (`ST8059048`, `ST8059050` before and after). So "saved" means into the in-memory object. (The polygon itself is off-screen in the image: I placed it in the wrong coordinate frame, which does not affect the save.) *Steps:* New Shapes layer, draw, select it, Shift+E; then `ls <store>/shapes`. *Evidence:* [screens/napari-spatialdata/m09_roi_saved_in_memory.jpg](screens/napari-spatialdata/m09_roi_saved_in_memory.jpg)

      **Source and docs.** Which reading of "written back" applies: the GUI writes labels into the **in-memory** SpatialData object (Extended Data Fig. 3: annotations "are then exported into the underlying SpatialData"). Writing them to the store on disk needs code (`sdata.write_element`); the app logs "Annotations only added in memory, please manually save to disk." Hence P, not Y. GUI annotation is real: Scatter lasso/rectangle ROIs become an obs column ([`_view.py#L184`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/_view.py#L184), [`#L212`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/_view.py#L212)) and drawn shapes/points are saved into the SpatialData object (Shift+E, [`_viewer.py#L61`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/_viewer.py#L61); [`#L284`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/_viewer.py#L284)). But for a SpatialData store the "save" is in memory only: `logger.warning("Annotations only added in memory, please manually save to disk.")` ([`_viewer.py#L177`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/_viewer.py#L177)); writing to the zarr needs `sdata.write_element(...)` in code. Only the standalone-AnnData mode writes a file from a dialog (`.h5ad`/`.zarr`/`.csv`, [`_view.py#L319`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/_view.py#L319)). Images/labels cannot be saved; existing elements cannot be updated ([`_viewer.py#L306`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/_viewer.py#L306)). Arguably Y if "written back" means into the live object; P under a strict "persisted" reading.
