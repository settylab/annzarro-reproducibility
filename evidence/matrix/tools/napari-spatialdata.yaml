    detail: |-
      **Checked in the running app (2026-10-04).** Observation: the image layer holds an xarray `DataArray` (dask-backed, read from zarr; this example's hires image is single-scale), while the table X is an in-memory `csr_matrix` (6484 × 31053). Gene colouring still fails here without the shim: `AttributeError: 'AnnData' object has no attribute '_get_X'`, so the spots were coloured by an obs column. *Steps:* printed by the script

      **Source and docs.** Images and labels are lazy multiscale dask (`DataTree` pyramid passed as a list of scales, [`utils/_utils.py#L255`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/utils/_utils.py#L255)). But points are materialised with `.compute()` ([`_viewer.py#L719`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/_viewer.py#L719)) and the AnnData table is read whole with `anndata.read_zarr` ([`SD/_io/io_table.py#L28`](https://github.com/scverse/spatialdata/blob/ea93a37203d187020c5d50a7f984dbf8c264a3ae/src/spatialdata/_io/io_table.py#L28)).

