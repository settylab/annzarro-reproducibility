  remote:
    reason: >-
      The CLI treats a URL as a local path; a remote zarr reaches the viewer only through Python (Interactive(sd.read_zarr(url))),
      so P.
    detail: |-
      **Checked in the running app (2026-10-04).** Observation: `python -m napari_spatialdata view https://example.org/remote.zarr` stops at `AssertionError: Error: $DEMO_ROOT/napari-spatialdata/https:/example.org/remote.zarr does not exist`. The CLI treats the URL as a local path. A remote store reaches the viewer only through Python (`Interactive(sd.read_zarr(url))`, not run). *Steps:* the command above

      **Source and docs.** The GUI/CLI path requires a local directory: `assert p.exists()` ([`__main__.py#L47`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/__main__.py#L47)). spatialdata itself reads "on-disk or remote" stores ([`SD/_io/io_zarr.py#L140`](https://github.com/scverse/spatialdata/blob/ea93a37203d187020c5d50a7f984dbf8c264a3ae/src/spatialdata/_io/io_zarr.py#L140)), so `Interactive(sd.read_zarr("https://…"))` from Python works: code only.
