  cells:
    reason: >-
      The View dock lists observations, layers, vars and obsm; the demo table's four obsp matrices are
      never offered.
    detail: |-
      **Checked in the running app (2026-10-04).** On the demo table (obsp `spatial_kernel`, `spatial_distance`, `distances`, `connectivities`) the View dock offers Observations, Layers (`X`, `counts`, `log_normalized`), Vars, Obsm (`X_umap`, `spatial_upright`, `spatial`, `X_pca`), Dataframe columns. No obsp anywhere. *Steps:* `start.sh`; read the View dock. *Evidence:* [screens/napari-spatialdata/m04_view_dock_lists_no_obsp.jpg](screens/napari-spatialdata/m04_view_dock_lists_no_obsp.jpg)

      **Source and docs.** The table model accepts only `("obs", "var", "obsm", "columns_df")`: [`NS/_model.py#L40`](https://github.com/scverse/napari-spatialdata/blob/75b8c346bee64ad7428d753b62eb2f8dff64a0c2/src/napari_spatialdata/_model.py#L40). `grep -rn obsp src/` returns nothing.
