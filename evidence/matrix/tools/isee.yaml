  focus:
    mark: N
    reason: >-
      The single selection carries only an identity (a gene becomes feature colouring, a cell a red dot)
      and no shipped panel uses the cell's colPairs row, so the figure's P should be N.
    detail: |-
      **Focus, checked in the running app.** iSEE's "single selection" carries a gene or cell *identity*: a gene becomes feature colouring, and a cell becomes a red dot. No shipped panel turns the focused cell into its row of `colPairs` or any other relation, and a precomputed colData row does not follow the focus. The earlier Y rested on this (a2)-type mechanism, which the strict column excludes. A user could write a custom `Panel` subclass that reads `colPair(se)[i, ]` for the transmitted sample. That would justify P, but no such panel exists in iSEE or its nine extensions, and I did not write one.

      **Source and docs.** Under the loose definition: "Single selections": "transmitting a selection of a single feature or sample ... direct other panels to focus on a feature or sample of interest", e.g. a row data table click recolours a reduced-dimension plot by that gene; a chosen sample is highlighted ([vignettes/links.Rmd#L225-262](https://github.com/iSEE/iSEE/blob/f6c190304e95e35503a5cc9444c9e0607ddc58ab/vignettes/links.Rmd#L225-L262)). Slots `ColorByFeatureSource`, `ColorByFeatureDynamicSource`, `YAxisFeatureSource` ([R/AllClasses.R#L174-177](https://github.com/iSEE/iSEE/blob/f6c190304e95e35503a5cc9444c9e0607ddc58ab/R/AllClasses.R#L174-L177), [R/panel_FeatureAssayPlot.R#L14](https://github.com/iSEE/iSEE/blob/f6c190304e95e35503a5cc9444c9e0607ddc58ab/R/panel_FeatureAssayPlot.R#L14)). This matches the column's own definition; the earlier P only noted it is not a matrix row, which columns 1-2 already capture.
