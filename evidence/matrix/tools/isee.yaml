  de:
    mark: N
    reason: >-
      Core iSEE computes no DE; the iSEEu DynamicMarkerTable runs findMarkers on a selection, but extensions
      added in code are out of scope (Fig. 1c rule: core tools only), so N.
    detail: |-
      **Checked in the running app (2026-10-04).** With the iSEEu panel added in code: a brush on plot 1 (left, lymphoid island) is sent to Dynamic marker table 1, which runs `scran::findMarkers`. On relaunch from the saved state the table filled in 4 s (16,285 genes; top Cd79a, Cd79b, Ighm). **But a live brush did not refresh the table:** in both sessions it stayed unchanged for 180 s after the brush (first session: "No data available"; second: still the old ranking after a new brush on the neutrophil arm). Download panel output did include `DynamicMarkerTable1.csv` (1.18 MB). So the computation works and the live update did not happen in my runs; I did not find out why. *Steps:* `matrix_app.R main`; drag a rectangle on plot 1; watch Dynamic marker table 1. Or `matrix_app.R restore <state.rds>` to see the table filled at launch. *Evidence:* [m10_brush_source_umap.jpg](screens/isee/m10_brush_source_umap.jpg), [m10_dynamic_marker_table_on_brush.jpg](screens/isee/m10_dynamic_marker_table_on_brush.jpg) (live, empty), [m10_dynamic_marker_table_filled.jpg](screens/isee/m10_dynamic_marker_table_filled.jpg) (at relaunch), [m10_dynamic_marker_table_after_rebrush.jpg](screens/isee/m10_dynamic_marker_table_after_rebrush.jpg)

      **Source and docs.** Core: "relies primarily on precomputed values" (`vignettes/basic.Rmd` L126). But the official extension iSEEu ships `DynamicMarkerTable`, which "dynamically identifies marker genes for a selected subset of samples" by running `scran::findMarkers` on the active selection vs the rest ([iSEEu R/DynamicMarkerTable.R#L1-6](https://github.com/iSEE/iSEEu/blob/2f5ca87331d85898802d8e0517087c478fb5a003/R/DynamicMarkerTable.R#L1-L6), [L303-309](https://github.com/iSEE/iSEEu/blob/2f5ca87331d85898802d8e0517087c478fb5a003/R/DynamicMarkerTable.R#L303-L309)). The panel must be added in code at launch (`iSEE(sce, initial=list(..., DynamicMarkerTable(...)))`), hence P. iSEEde only displays precomputed DE.
