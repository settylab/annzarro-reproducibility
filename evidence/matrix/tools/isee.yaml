  share:
    mark: P
    reason: >-
      The panel state downloads as an RDS file, but the shipped landing page rejected it (SE over 5 MB)
      and no link carries state; it restores only via iSEE(initial=) in code, so the figure's Y should
      be P.
    detail: |-
      **Checked in the running app (2026-10-04).** Export > Display panel settings > Download RDS (SE unticked) saved `iSEE_memory.rds` (1,827 bytes, a list with `memory`). Relaunching with `iSEE(sce, initial = readRDS(f)$memory)` restored all five panels with the brush, the `Neutrophil` search, the Restrict tick and the marker table. The GUI path failed: the default landing page (`createLandingPage()`) refused the 64 MB SE file with "Maximum upload size exceeded" (Shiny's default 5 MB limit), and the server logged `Error in readRDS(x$datapath) : bad 'file' argument`. No link or URL state: restoring needs a file plus code at launch, or a deployer-configured landing page. *Steps:* Export > Display panel settings > untick "include SummarizedExperiment" > Download RDS; then `Rscript demos/isee/matrix_app.R restore iSEE_memory.rds`. Landing page: `matrix_app.R landing`, upload both files, Launch. *Evidence:* [m12_panel_settings_download_rds.jpg](screens/isee/m12_panel_settings_download_rds.jpg), [m12_restored_from_state_file.jpg](screens/isee/m12_restored_from_state_file.jpg), [m12_landing_page_upload.jpg](screens/isee/m12_landing_page_upload.jpg), [m12_landing_page_after_launch.jpg](screens/isee/m12_landing_page_after_launch.jpg)

      **Source and docs.** The F1000 paper restores state only through generated code ("the code required to reproduce the current state ... used in startup scripts"). In the app, the state downloads as an RDS file, but the shipped landing page refuses it for any SE over 5 MB, and no link carries the state; restoring it needs `iSEE(initial=)` in code. Hence P. "Display panel settings" offers "Download RDS" of the panel list ([R/observers_general.R#L68-76](https://github.com/iSEE/iSEE/blob/f6c190304e95e35503a5cc9444c9e0607ddc58ab/R/observers_general.R#L68-L76)); the default landing page has an "Initial state RDS file" upload, and with `requireButton=FALSE` Shiny URL bookmarking can launch a state "by simply clicking a link" ([R/createLandingPage.R#L29-31, L96](https://github.com/iSEE/iSEE/blob/f6c190304e95e35503a5cc9444c9e0607ddc58ab/R/createLandingPage.R#L29-L31)).
