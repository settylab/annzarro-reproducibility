  lazy:
    reason: >-
      The server keeps the loom open and reads one gene row per request (about 12 kB of websocket frames
      for 4,322 cells); attributes are read whole.
    detail: |-
      **Checked in the running app (2026-10-04).** After the MITF pick the server pushed 18 websocket frames over `wss://scope.aertslab.org/protobuf/`, the largest 12,487 bytes. That is the order of one value per cell for 4,322 cells; the matrix is never sent. The viewer stayed empty headless, so the colouring was not seen; the one-row server read is in code (`loom.py#L776-L777`). *Steps:* Gene page; DevTools → Network → WS; search `MITF`, pick the gene; read frame sizes. *Evidence:* [m05](screens/scope/m05_lazy_gene_MITF.jpg) + observation

      **Source and docs.** Server-side: `loompy.connect` keeps the HDF5 file open (`SC opt/scopeserver/dataserver/utils/loom_file_handler.py#L34`) and a gene request slices one row, `self.loom_connection[self.get_genes() == gene_symbol, :][0]` (`SC opt/scopeserver/dataserver/utils/loom.py#L776-L777`). Caveat: CPM normalisation without a stored `nUMI` sums the whole matrix (`#L760-L772`, the code's own TODO says it is slow at 1M rows). Browser always receives full-length per-cell vectors.

      **Scale group.** **Server process** (Python, loompy/h5py on HDF5 on server disk): gene rows read on demand; cell attributes (coordinates, annotations, regulon AUC) read whole per request. **Browser** holds full per-cell arrays for coordinates and the current colour vectors. Evidence: `loom_file_handler.py#L34`; `loom.py#L776-L777`, `#L906-L931`, `#L842-L850`.
