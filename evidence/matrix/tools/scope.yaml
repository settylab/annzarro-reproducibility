    checked:
      date: '2026-10-09'
      by: selection-test session
      how: running app
    detail: |-
      **Observed 2026-10-09 in the running app** (SCope 1.8.2, 9ae5207, local Docker image scope:1.8.2-9ae5207-final, frontend http://127.0.0.1:55850/, SCope_Test.loom with 100 cells; Google Chrome 155.0.8059.39 driven through the Claude in Chrome extension). The viewers draw in real Chrome; they did not in automated headless Chromium (0 WebGL draw calls on 2026-10-05).

      Regulon page, three linked viewers. A lasso around one dot group gave "Selection 1 (25 cells)", and the same 25 cells turned green in all 3 viewers. The overlap table read Cluster set 0 / Unannotated Cluster 2 = 25, Cluster set 1 / Unannotated Cluster 2 = 7, Cluster set 1 / Unannotated Cluster 3 = 6 (page 1 of 2). The eye icon hides the selection in all 3 viewers and a second click restores it.

      Compare page, annotation "Half cells". Drag and drop worked: First Half to display 1 (fewer dots), First plus Second Half to display 3 (all cells, OR superposition). A lasso in display 3 gave "Selection 1 (25 cells)"; the same group is magenta in display 3 and in display 1, where only its first-half cells are colored (about 15 dots, an estimate, not counted).

      The AUC threshold filter ("AUC threshold: 0.3577 (matched points: 48 / 100)") recolors red and grey and hides nothing, so that route highlights without restricting. Selections are per page: the Gene page lists none and the Regulon page shows Selection 1 again on return. The selection magnifier opens a table of Cell ID, expression, AUC, annotation and clustering with Download; no sign-in appeared. Saving a selection as a clustering needing ORCID login is from source only, not verified.

      **Deviations.** (a) Both lassos were drawn with synthetic PointerEvents (pointerdown, 16 pointermoves, pointerup) dispatched on the viewer canvas, because the extension has no raw mouse down, move and up; the selection, overlap table and recoloring are SCope's own response. (b) The screenshots are JPG viewport captures from the extension, not screencapture PNGs. (c) Not done: a second lasso in another viewer, moving the threshold handle, Compare dot counts. The old "0 WebGL draw calls" note applies to automated Chromium only. The code references below say why it works: selections are kept per page and every viewer repaints them.

      Record and harness: notes/comparison/demos/scope/selection/record.txt.
    mark: Y
