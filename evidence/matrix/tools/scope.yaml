  de:
    reason: Cluster markers are precomputed loom attributes; no control computes DE in the session.
    detail: |-
      **Checked in the running app (2026-10-04).** Query types offer no DE, and no control computes markers; markers shown in the sidebar are precomputed `ClusterMarkers_*` loom attributes (code). *Steps:* Query-type menu; sidebar after picking a cluster. *Evidence:* [m04 query types](screens/scope/m04_slots_feature_type_menu.jpg)

      **Source and docs.** Cluster markers are precomputed row attributes `ClusterMarkers_<id>` read from the loom (`loom.py#L1009-L1026`). The only in-session computation is AUCell gene-set scoring (Davie et al. 2018, main text, section "SCope: Cloud-Based Exploration of Single-Cell Atlases") and cluster overlap of a lasso selection (`loom.py#L410`). Not DE.
