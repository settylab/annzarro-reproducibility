    reason: >-
      The loom's col_graphs (the obsp analogue) are never read; colour sources are genes, regulons, annotations,
      clusterings and metrics.
    detail: |-
      **Checked in the running app (2026-10-04).** The Coordinates menu lists stored embeddings only: Expression tSNE, PCA, Diffusion Map, Expression UMAP, AUCell UMAP, CCA. Query types are all features, gene, regulon and cluster. No graph or pairwise entry. *Steps:* Gene page; click "Expression tSNE ▾" under Settings → Coordinates; click "all features" next to the red search box. *Evidence:* [m04 coordinates](screens/scope/m04_slots_coordinates_menu.jpg), [m04 query types](screens/scope/m04_slots_feature_type_menu.jpg)

      **Source and docs.** Loom's pairwise slots (`col_graphs`, analogue of obsp) are never read: `grep -rn col_graphs opt/scopeserver` returns nothing. Colour sources are genes, regulons, annotations, clusterings, metrics (`SC src/proto/s.proto#L20-L47` lists all RPCs).
