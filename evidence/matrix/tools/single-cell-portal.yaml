  focus:
    reason: >-
      Clicking a DE gene re-drives the scatter, violin and spatial panels with that gene's expression
      (feature colouring), and no cell is ever a focus, so N by the strict definition.
    detail: |-
      **Focus, checked in the running app.** The DE click is (a2): one gene's expression re-drives the scatter and violin panels together (and spatial plots in studies that have them, per the code cited in the matrix row), which is N under the strict definition; no cell is ever a focus and no pairwise matrix exists.

      **Source and docs.** Only feature colouring exists, which the strict definition scores N. Clicking a gene in the DE table calls `searchGenes`, which re-drives scatter, distribution and spatial panels together ([C/.../DifferentialExpressionPanel.jsx#L269-L276](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/javascript/components/explore/DifferentialExpressionPanel.jsx#L269-L276)). No focused cell drives anything, and no pairwise row is read, so N. Repeat: SCP2805, Explore, open "Differential expression", click a gene.
