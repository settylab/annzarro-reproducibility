  every_cell:
    reason: >-
      Large studies open on a 100,000-cell subsample by default; 'All Cells' in the subsampling menu draws
      every cell; scored by what the GUI can do (reading B), so Y.
    detail: |-
      **Checked in the running app (2026-10-04).** SCP383 with `?genes=Sox2`: Sox2 expression scatter beside the cluster scatter, each "1306127 cells, subsample[100000]". The Subsampling menu offers `100000` (default) or `All Cells`. *Steps:* Open `https://singlecell.broadinstitute.org/single_cell/study/SCP383?genes=Sox2#study-visualize`; Options → Subsampling. *Evidence:* [m01](screens/single-cell-portal/m01_plots_render_SCP383_Sox2.jpg), [m01 subsampling](screens/single-cell-portal/m01_every_cell_subsampling_menu_SCP383.jpg)

      **Scale group.** **Downsampled by default above 100k.** At ingest each cluster with >1,000 cells is subsampled at 1k/10k/20k/100k, stratified by an annotation ([doc](https://singlecell.zendesk.com/hc/en-us/articles/360060610032-Cluster-file-subsampling); `SUBSAMPLE_THRESHOLDS = [100000, 20000, 10000, 1000]`, [cluster_group.rb#L67-L70](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/models/cluster_group.rb#L67-L70)). Clusters with ≥100k cells default to the 100k sample ([cluster_viz_service.rb#L89-L93](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/lib/cluster_viz_service.rb#L89-L93), [ExploreDisplayTabs.jsx#L89-L94](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/javascript/components/explore/ExploreDisplayTabs.jsx#L89-L94)). If subsampling has not completed, every cell is sent (SCP2805). No binning or density mode. A flagged "progressive loading" path shows a pre-rendered WebP of a gene's expression before the points arrive ([ScatterPlot.jsx#L420-L450](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/javascript/components/visualization/ScatterPlot.jsx#L420-L450)). Evidence: Measured 2026-10-03: SCP383 default returned 100,000 of 1,306,127 points; SCP259 100,000 of 123,006; SCP2805 3,177,310 of 3,177,310 (`isSubsampled: false`, thresholds `[]`).
