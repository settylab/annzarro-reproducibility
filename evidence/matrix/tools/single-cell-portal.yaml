  remote:
    reason: >-
      Data enter only through the signed-in upload wizard into SCP's own bucket; no field takes a user
      URL, S3 or GCS path.
    detail: |-
      **Checked in the running app (2026-10-04).** N: nothing to show; searched Explore Options, the Download tab and the study menus: no field for a user URL, S3 or GCS path. Data enter only through the signed-in upload wizard ("Create study"). *Steps:* Explore and Download tabs of any study.

      **Source and docs.** You cannot point SCP at your own store; files are uploaded into the study's Terra/GCS bucket and ingested. The viewer reads MongoDB, plus a few precomputed artefacts from SCP's own bucket (DE TSVs, [DifferentialExpressionGroupPicker.jsx#L14](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/javascript/components/visualization/controls/DifferentialExpressionGroupPicker.jsx#L14)). Same architecture as CELLxGENE Explorer but no user-facing remote read; I chose N rather than CELLxGENE's P because SCP's main data path is a database, not the store. Arguable.
