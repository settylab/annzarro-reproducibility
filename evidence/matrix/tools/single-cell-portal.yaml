  de:
    reason: >-
      The GUI shows only DE tables precomputed at ingest; no control computes DE for a new group or selection,
      so P.
    detail: |-
      **Checked in the running app (2026-10-04).** The Differential expression panel shows a precomputed table for the chosen group ("B cells"); the GUI has no control to compute DE for a new group or a lasso selection (the REST endpoint is not wired to the frontend, see matrix row). *Steps:* SCP1671 Explore; Options → Differential expression; group "B cells". *Evidence:* [m10](screens/single-cell-portal/m10_de_precomputed_table_SCP1671.jpg)

      **Source and docs.** GUI shows only precomputed DE: SCP runs Scanpy `rank_genes_groups` (Wilcoxon) one-vs-rest and pairwise at ingest ([I/ingest/de.py#L498-L502](https://github.com/broadinstitute/scp-ingest-pipeline/blob/af4f23505ee31dbe6c0a50d79c5f103c8ebeb4b2/ingest/de.py#L498-L502); [DE doc](https://singlecell.zendesk.com/hc/en-us/articles/28157597291291-Pre-computed-differential-expression-DE)). A signed-in user can request a new DE job only through the REST API `POST /api/v1/site/studies/:accession/differential_expression` ([site_controller.rb#L478-L490](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/controllers/api/v1/site_controller.rb#L478-L490)); it runs as a batch job, weekly quota 5 ([differential_expression_service.rb#L15](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/lib/differential_expression_service.rb#L15)), and no frontend code calls it (`grep -rn "/differential_expression" app/javascript` finds only the bucket path). Not "in session" either way; N is defensible.
