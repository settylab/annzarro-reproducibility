  lazy:
    reason: >-
      The server reads one gene on demand from its per-gene store (5.2 MB for one gene over 1.3M cells);
      the browser gets whole coordinate arrays.
    detail: |-
      **Checked in the running app (2026-10-04).** Observation with curl against the API the Explore tab uses: one gene (Sox2) for all 1,306,127 cells returns 5,226,850 bytes in 5.1 s (`fields=expression&gene=Sox2&subsample=all`); for the 100,000 subsample 401,453 bytes in 2.0 s. Coordinates, cell names and annotation for the subsample are a separate 6,456,342-byte response. The server reads one gene on demand from its per-gene store; the source h5ad is not opened. (The browser's own request log was not captured: Playwright's `requestfinished` hook saw no `/api/v1/` calls during the first page load, so I measured with curl.) *Steps:* `curl -s -o /dev/null -w '%{size_download} %{time_total}\n' 'https://singlecell.broadinstitute.org/single_cell/api/v1/studies/SCP383/clusters/1M%20cell%20clusters?annotation_name=Cluster&annotation_scope=study&annotation_type=group&fields=expression&gene=Sox2&subsample=all'`

      **Source and docs.** Server side. Expression is stored per gene as `DataArray` documents in MongoDB and fetched per requested gene ([C/app/models/gene.rb#L25-L46](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/models/gene.rb#L25-L46), [C/app/lib/expression_viz_service.rb#L146](https://github.com/broadinstitute/single_cell_portal_core/blob/1fd5f77ca34a63f9949c458b80cf23df848612f2/app/lib/expression_viz_service.rb#L146)). The source h5ad is never opened at view time. Coordinates for the chosen cluster and subsample arrive whole.

      **Scale group.** **Server, lazy per gene.** Ingest parses the file once into MongoDB; at view time Rails reads only the requested gene's scores and the chosen cluster's coordinate arrays. The browser receives whole coordinate arrays for the selected subsample (or all cells) as JSON and holds them in memory for Plotly. Evidence: `gene.rb#L25-L46`, `expression_viz_service.rb#L146`, `cluster_viz_service.rb#L160-L181` at `1fd5f77`.
