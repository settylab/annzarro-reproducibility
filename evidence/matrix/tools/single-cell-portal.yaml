    reason: >-
      Ingest reads obsm embeddings, obs metadata and one expression matrix, and Options offers no pairwise
      entry; obsp is never read.
    detail: |-
      **Checked in the running app (2026-10-04).** Options holds Clustering (embeddings), Spatial groups, Annotation (cell metadata; on SCP2510 `biosample_id`, `donor_id`, `library`, `ntx`, `ngene`, `hubType`, `type_lvl1`), Subsampling and "Filter plotted cells". No pairwise entry anywhere. *Steps:* SCP2510 Explore; open the Annotation menu. *Evidence:* [m04](screens/single-cell-portal/m04_slots_annotation_menu_SCP2510.jpg)

      **Source and docs.** AnnData ingest reads embeddings from `obsm`, metadata from `obs`, expression from `X`/`.raw`/a layer ([I/ingest/anndata_.py#L73-L82](https://github.com/broadinstitute/scp-ingest-pipeline/blob/af4f23505ee31dbe6c0a50d79c5f103c8ebeb4b2/ingest/anndata_.py#L73-L82), [#L131-L164](https://github.com/broadinstitute/scp-ingest-pipeline/blob/af4f23505ee31dbe6c0a50d79c5f103c8ebeb4b2/ingest/anndata_.py#L131-L164)). `grep -rn "obsp\|varp\|varm"` over both repos' `app/`, `ingest/` finds nothing.
