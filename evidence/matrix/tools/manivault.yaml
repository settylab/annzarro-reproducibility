  annot:
    reason: >-
      A lasso selection becomes a named, coloured cluster via the scatterplot's Clustering > Add cluster;
      it is stored in a cluster dataset, saved with the project and exported as JSON (checked in the app).
    detail: >-
      **Observed (desktop follow-up, 2026-10-04).** The 2x2-grid toolbar icon opens Clustering: Cluster
      name, Cluster color, Target clusters dataset (a picker plus a button that creates a new cluster
      dataset) and Add cluster. The name and colour fields stay disabled until a target dataset is chosen,
      which is why the first session saw an icon that did nothing. Choosing leiden as the target switched
      the UMAP colouring to leiden (side effect); Add cluster then added my_cells (442 cells) to leiden,
      which now lists 26 clusters, and Export > Clusters (JSON) wrote the name, colour and 442 indices
      (demos/manivault/f3_my_cells_clusters.json). Because the cluster went into an existing cluster set,
      those 442 cells now belong to two leiden clusters; a separate cluster dataset avoids that (create
      button, not tried). **Criterion.** As for CELLxGENE Annotate and the UCSC Cell Browser (Y), a user-chosen
      cell set becomes a named label stored as data and exported from the GUI; it is not written back
      into the h5ad, which no Y row does either. Vitessce is P because its cell sets live in the view
      configuration, not in a dataset. Hence Y. **Source.** ManiVaultStudio/Scatterplot a458c7b, src/ClusteringAction.cpp
      L12-L32, L74-L92; the same strings ('Add cluster', 'Cluster name', 'Create cluster dataset') are
      in the shipped libScatterplotPlugin_p1.0.0_c1.5.0.dylib.
    evidence:
