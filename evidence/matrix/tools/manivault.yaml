  spatial:
    reason: >-
      Any 2-D obsm can be a scatterplot position, so obsm['spatial'] should plot as axes; this was not
      observed because the Visium file's CSC-encoded X was misread.
    detail: >-
      **Observed (negative, with cause).** Loading spatial_demo.h5ad (2,693 spots, X stored as CSC) produced
      a single 2,000 x 2,000 dataset with no obs or obsm: the loader reads X as CSR (`xsize = indptr.size()
      - 1`), so a CSC matrix with 2,001 indptr entries becomes 2,000 rows and the obs-indexed groups no
      longer match. The file itself is correct (checked with h5py). With a CSR file, obsm['spatial'] would
      load like obsm/X_umap, which plots (m00); this is inference, so P, and the CSC limitation is noted.
    evidence:
    - kind: screenshot
      path: notes/comparison/screens/manivault/m05_spatial_csc_input_misread_hierarchy.jpg
      label: spatial_demo loaded without obsm
