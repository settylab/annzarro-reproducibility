cells:
  cells:
    reason: >-
      A stored obsp matrix can colour a scatterplot, one row at a time, but the row is picked by number,
      so the user cannot tell which cell on the plot it belongs to: partial.
    detail: >-
      **Observed.** The H5AD loader loads obsp by default; the scatterplot's Datasets > Color list offers
      obsp/connectivities, obsp/diffusion_distance and obsp/distances, and colouring the UMAP by obsp/diffusion_distance
      with dimension 4237 shows one cell's distance row. Rows are picked by a 1-based number (dense input;
      sparse input is numbered from 0), not by cell name, and nothing ties the row to a selected cell.
      **Scored partial (operator, 2026-10-05).** Full marks need the user to know which cell the shown
      row belongs to (for example by focusing that cell). Here the row is a number in a dimension field
      and a click on a cell does not select its row, so exploring the matrix this way is very hard. The
      screenshots stay as evidence that it can colour by a row.
    evidence:
    - kind: screenshot
      path: notes/comparison/screens/manivault/m01_cells_colour_sources.jpg
      label: obsp matrices in the Color list
    - kind: screenshot
      path: notes/comparison/screens/manivault/m01_cells_obsp_row_as_colour.jpg
      label: UMAP coloured by an obsp row
