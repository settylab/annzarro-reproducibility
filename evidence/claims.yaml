    note: Protocol time estimate, stated as such in the Timing section; not timed.
  timing.prep:
    text: about 10 min on a 16-core workstation with 32 GiB RAM
    file: manuscript/body.tex
    kind: number
    source:
      - {file: data_prep/README.md, pattern: 'download \(16 range requests, network-bound\) \| 5 min (\d+) s'}
      - {file: data_prep/README.md, pattern: '`run_kompot.py` total \| (\d+) s'}
      - {file: data_prep/README.md, pattern: '`prepare_annzarro_store.py` total \| (\d+) s'}
      - {file: data_prep/README.md, pattern: 'Plan for about (\d+) GB at this dataset size'}
    compute: ((5 * 60 + v[0] + v[1] + v[2]) / 60, v[3])
    format: 'about {0:.0f} min on a 16-core workstation with {1:.0f} GiB RAM'
    tolerance: 3
    status: ok
    note: Measured on a 16-core Mac with 128 GB; 32 GB is the README's advice (peak RSS 29 GB). Sum 7.4 min.
  timing.prep_parts:
    text: download 5.5 min, Kompot 1 min, store preparation 1 min
