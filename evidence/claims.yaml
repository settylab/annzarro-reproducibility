# Claims ledger: every quantitative or comparative claim in the manuscript and its source.
# Checked by evidence/tools/claims.py (schema in its docstring); shown on the site as claims.md.
# Status: ok | interim (still moving) | unsourced (no file in this repo holds it).
# Text is the exact tex phrase; `format` must turn the recomputed value(s) into that phrase.

defs:
  # where-blocks reused below (YAML anchors)
  ev95_all: &ev95_all {clean: "True", tag: all_v041, n_cells: 95624334, event: first_plot, status: ok}
  ev95_sub_gene: &ev95_sub_gene {clean: "True", tag: sub_v041, n_cells: 95624334, color: gene, status: ok}
  ev95_sub_cat: &ev95_sub_cat {clean: "True", tag: sub_v041, n_cells: 95624334, color: cat, status: ok}
  ceil_clean_ok: &ceil_clean_ok {clean: "True", tag: ceil_rerun, status: ok}
  others_noviewer: &noviewer
    - {matrix: cellxgene-explorer.cells, expect: [N, P]}
    - {matrix: cellxgene-explorer.genes, expect: [N, P]}
    - {matrix: vitessce.cells, expect: [N, P]}
    - {matrix: vitessce.genes, expect: [N, P]}
    - {matrix: ucsc-cell-browser.cells, expect: [N, P]}
    - {matrix: ucsc-cell-browser.genes, expect: [N, P]}
    - {matrix: single-cell-portal.cells, expect: [N, P]}
    - {matrix: single-cell-portal.genes, expect: [N, P]}
    - {matrix: cirrocumulus.cells, expect: [N, P]}
    - {matrix: cirrocumulus.genes, expect: [N, P]}
    - {matrix: scope.cells, expect: [N, P]}
    - {matrix: scope.genes, expect: [N, P]}
    - {matrix: shinycell.cells, expect: [N, P]}
    - {matrix: shinycell.genes, expect: [N, P]}
    - {matrix: kana.cells, expect: [N, P]}
    - {matrix: kana.genes, expect: [N, P]}
    - {matrix: isee.cells, expect: [N, P]}
    - {matrix: isee.genes, expect: [N, P]}
  src_n95: &n95 {csv: benchmark/scale/results/browser_v041_summary.csv, where: {tag: all_v041, event: first_plot, color: gene}, column: n_cells, agg: max}
  src_threshold: &threshold {file: notes/sources/annzarro_v0.4.1_tag.txt, pattern: 'subset_threshold: (\d+)'}
  src_subset_n: &subset_n {file: notes/sources/annzarro_v0.4.1_tag.txt, pattern: 'subset_size: (\d+)'}
  src_large: &large {file: notes/sources/annzarro_v0.4.1_tag.txt, pattern: 'large_plot_points: (\d+)000000\n'}
  src_heaplim: &heaplim {jsonl: benchmark/scale/results/heapcap_v041.jsonl, column: heap.last.0, pattern: 'lim (\d+)'}
  src_bm_cells: &bm_cells {json: figures/numbers/fig2.json, key: n_cells}
  src_bm_genes: &bm_genes {json: figures/numbers/fig3.json, key: n_genes}
  src_atlas_cells: &atlas_cells {file: benchmark/deployment/demo-server_runtime_2026-10-01.md, pattern: 'atlas-1.17M-scvi\.zarr \| 78G \| ([\d,]+)'}
  src_atlas_genes: &atlas_genes {file: benchmark/deployment/demo-server_runtime_2026-10-01.md, pattern: 'atlas-1.17M-scvi\.zarr \| 78G \| [\d,]+ \| ([\d,]+)'}
  src_hpc_cells: &hpc_cells {csv: benchmark/scale/results/hpc/full/t_v041_hpctemp_reduced/run_v041_hpctemp_reduced/grid/http.csv, where: {case_id: 'tahoe_dense_1M_allx4:dense_layer_gene_col:lognorm_panel', phase: cold}, column: n_values, agg: first}   # the public HPC layer's cells (a gene column's length)
  src_hpc_genes: &hpc_genes {csv: benchmark/scale/results/hpc/full/t_v041_hpctemp_reduced/run_v041_hpctemp_reduced/grid/http.csv, where: {case_id: 'tahoe_dense_1M_allx4:dense_layer_cell_row:lognorm_panel', phase: cold}, column: n_values, agg: first}   # its genes (a cell row's length)
  src_fig2_rrows: &laptop {file: benchmark/scale/NOTES.md, anchor: 'Apple M3 Max (16 cores), 128 GB RAM'}   # installed RAM: sysctl hw.memsize 137,438,953,472 B = 128 GiB; the text says GiB

claims:
  # ======================================================================= abstract
  abs.tahoe.n:
    text: 95.6 million
    file: manuscript/sections/abstract.tex
    kind: number
    source: *n95
    compute: v[0] / 1e6
    format: '{:.1f} million'
    status: ok
  abs.tahoe.every_cell_time:
    text: about 5 to 7 s
    file: manuscript/sections/abstract.tex
    kind: number
    source:
      - {csv: benchmark/scale/results/browser_v041_events.csv, where: {clean: "True", tag: all_v041, n_cells: 95624334, event: first_plot, status: ok}, column: seconds, agg: min}
      - {csv: benchmark/scale/results/browser_v041_events.csv, where: {clean: "True", tag: all_v041, n_cells: 95624334, event: first_plot, status: ok}, column: seconds, agg: max}
    compute: "'{:.0f}'.format(v[0]) if round(v[0]) == round(v[1]) else '{:.0f} to {:.0f}'.format(v[0], v[1])"
    format: 'about {} s'
    status: ok
    note: Clean first plots of every cell at 95.6M (all_v041, 3 cold reps per colouring), at the app's automatic size and opacity; tag v0.4.1 (78c9da6).
  abs.tahoe.part_size:
    text: 100,000-cell part
    file: manuscript/sections/abstract.tex
    kind: number
    source: *subset_n
    format: '{:,.0f}-cell part'
    status: ok
  abs.tahoe.part_open:
    text: opens in 4 s
    file: manuscript/sections/abstract.tex
    kind: number
    source: {csv: benchmark/scale/results/browser_v041_events.csv, where: {<<: *ev95_sub_gene, event: first_plot}, column: seconds, agg: median}
    format: 'opens in {:.0f} s'
    status: ok
    note: Median of 3 clean runs coloured by a gene (2.99 s); by cell line it is 2.5 s.
  # ======================================================================= main.tex: key points
  # ======================================================================= main.tex: Supplementary Note 1
  supp1.annzarro.n:
    text: 95,624,334 cells of Tahoe-100M
    file: manuscript/supplement.tex
    kind: number
    source: *n95
    format: '{:,.0f} cells of Tahoe-100M'
    status: ok
  supp1.annzarro.threshold:
    text: above 200,000 cells the default view is a reproducible 100,000-cell subset
    file: manuscript/supplement.tex
    kind: number
    source: [*threshold, *subset_n]
    format: 'above {0:,.0f} cells the default view is a reproducible {1:,.0f}-cell subset'
    status: ok
  supp1.annzarro.scale_marks:
    text: and one setting draws every cell in one plot
    file: manuscript/supplement.tex
    context: '\textbf{AnnZarro.}'
    kind: comparison
    source:
      - {matrix: annzarro.every_cell, expect: Y}
      - {matrix: annzarro.lazy, expect: Y}
      - {matrix: annzarro.subset, expect: Y}
      - {matrix: annzarro.auto_subset, expect: Y}
    status: ok
  supp1.cellxgene.filesize:
    text: 50 GB
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/cellxgene.md, pattern: 'size for submissions to (\d+) GB'}
    format: '{:.0f} GB'
    status: ok
  supp1.cellxgene.4_3M:
    text: more than 4.3 million cells can be submitted
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/cellxgene.md, pattern: 'Documented: ([\d.]+)M cells'}
    format: 'more than {:.1f} million cells can be submitted'
    status: ok
    note: notes record the NAR 2025 figure; the quoted guideline sentence and its line 31 are not in the notes.
  supp1.cellxgene.docline:
    text: line 31, section Scale Constraints; also at commit 9659d41
    file: manuscript/supplement.tex
    kind: qualitative
    source: {file: notes/comparison/cellxgene.md, anchor: 'at `main` and at commit `9659d41`'}
    status: ok
    note: Recorded in cellxgene.md "Discover submission guideline" (curl of the raw file at both refs, 2026-10-04).
  supp1.cellxgene.paper:
    text: up to 4.3 million cells in <1 min
    file: manuscript/supplement.tex
    kind: qualitative
    source: {file: notes/comparison/cellxgene.md, anchor: 'search "4.3 million"'}
    status: ok
    note: The notes cite the NAR 2025 sentence by search term; "<1 min" itself is not quoted there.
  supp1.cellxgene.11M:
    text: 11,441,407 cells, the mouse embryo timelapse
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/cellxgene.md, pattern: 'Observed: ([\d,]+) cells\*\* served by public Explorer \(mouse embryo timelapse\)'}
    format: '{:,.0f} cells, the mouse embryo timelapse'
    status: ok
  supp1.cellxgene.scale_marks:
    text: Every cell is drawn (WebGL draw count = number of cells)
    file: manuscript/supplement.tex
    kind: comparison
    source:
      - {matrix: cellxgene-explorer.every_cell, expect: Y}
      - {matrix: cellxgene-explorer.lazy, expect: Y}
      - {matrix: cellxgene-explorer.subset, expect: P}
    status: ok
  supp1.vitessce.n:
    text: 1,283,972 cells (Salcher et al.\ 2022
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/vitessce.md, pattern: '\*\*([\d,]+) cells × [\d,]+ genes\*\* \(Salcher 2022'}
    format: '{:,.0f} cells (Salcher et al.\ 2022'
    status: ok
  supp1.vitessce.scale_marks:
    text: cell sets highlight but do not subset
    file: manuscript/supplement.tex
    kind: comparison
    source:
      - {matrix: vitessce.every_cell, expect: Y}
      - {matrix: vitessce.lazy, expect: Y}
      - {matrix: vitessce.subset, expect: N}
    status: ok
  supp1.cirrocumulus.n:
    text: 1.3 million cells (documentation
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/cirrocumulus.md, pattern: '\*\*([\d.]+) million cells\*\*'}
    format: '{:.1f} million cells (documentation'
    status: ok
  supp1.cirrocumulus.scale_marks:
    text: selections dim or shrink the other cells
    file: manuscript/supplement.tex
    kind: comparison
    source:
      - {matrix: cirrocumulus.every_cell, expect: Y}
      - {matrix: cirrocumulus.lazy, expect: Y}
      - {matrix: cirrocumulus.subset, expect: P}
    status: ok
  supp1.isee.n:
    text: 68,579 cells (10x PBMC 68k
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/isee.md, pattern: '\*\*([\d,]+) cells\*\* \(10x PBMC 68k'}
    format: '{:,.0f} cells (10x PBMC 68k'
    status: ok
  supp1.isee.scale_marks:
    text: HDF5-backed assays read on demand
    file: manuscript/supplement.tex
    kind: comparison
    source:
      - {matrix: isee.every_cell, expect: Y}
      - {matrix: isee.lazy, expect: P}
    status: ok
    note: iSEE's lazy mark is P (HDF5-backed assays only).
  supp1.ucsc.n:
    text: 21,786,931 cells, PanSci
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/ucsc-cell-browser.md, pattern: '\*\*([\d,]+) cells\*\*, PanSci'}
    format: '{:,.0f} cells, PanSci'
    status: ok
  supp1.ucsc.portal:
    text: "``over 160 million cells'' across 1,600 datasets"
    file: manuscript/supplement.tex
    kind: number
    source:
      - {file: notes/comparison/ucsc-cell-browser.md, pattern: '"[\d,]+ datasets covering over (\d+) million cells"'}
      - {file: notes/comparison/ucsc-cell-browser.md, pattern: '"([\d,]+) datasets covering over \d+ million cells"'}
    format: "``over {0:.0f} million cells'' across {1:,.0f} datasets"
    status: ok
  supp1.ucsc.scale_marks:
    text: genes fetched by HTTP byte range from static files
    file: manuscript/supplement.tex
    kind: comparison
    source:
      - {matrix: ucsc-cell-browser.every_cell, expect: Y}
      - {matrix: ucsc-cell-browser.lazy, expect: Y}
      - {matrix: ucsc-cell-browser.subset, expect: P}
    status: ok
  supp1.shinycell.n:
    text: 161,764 cells in the ShinyCell2 CITE-seq tutorial
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/shinycell.md, pattern: '\*\*([\d,]+) cells\*\* \(PBMC CITE-seq'}
    format: '{:,.0f} cells in the ShinyCell2 CITE-seq tutorial'
    status: ok
  supp1.shinycell.ram_advice:
    text: about 30,000 cells per 8 GiB of RAM
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/shinycell.md, pattern: '~(\d+)k cells per 8 GB RAM'}
    compute: v[0] * 1000
    format: 'about {:,.0f} cells per 8 GiB of RAM'
    status: ok
  supp1.shinycell.scale_marks:
    text: one HDF5 chunk per gene read on demand
    file: manuscript/supplement.tex
    kind: comparison
    source:
      - {matrix: shinycell.every_cell, expect: Y}
      - {matrix: shinycell.lazy, expect: Y}
      - {matrix: shinycell.subset, expect: P}
    status: ok
    note: Lazy mark is P with an audit proposal to Y (ledger row B7).
  supp1.scanpy.n:
    text: 1.3 million cells (Scanpy paper
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/scanpy-seurat.md, pattern: '\*\*([\d.]+)M cells\*\* \(10x E18 mouse brain\)'}
    format: '{:.1f} million cells (Scanpy paper'
    status: ok
  supp1.scanpy.dask:
    text: plots about 1.4 million cells
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/scanpy-seurat.md, pattern: 'Scanpy dask tutorial uses \*\*([\d.]+)M cells'}
    format: 'plots about {:.1f} million cells'
    status: ok
  supp1.seurat.raster:
    text: rasterizes above 100,000 cells
    file: manuscript/supplement.tex
    kind: number
    source: {file: notes/comparison/scanpy-seurat.md, pattern: 'rasterizes\*\* \(not downsamples\) above ([\d,]+) cells'}
    format: 'rasterizes above {:,.0f} cells'
    status: ok
  supp1.scanpy.scale_marks:
    text: subsets by code
    file: manuscript/supplement.tex
    kind: comparison
    source:
      - {matrix: scanpy-seurat.every_cell, expect: Y}
      - {matrix: scanpy-seurat.lazy, expect: P}
      - {matrix: scanpy-seurat.subset, expect: P}
    status: ok

  # ======================================================================= body.tex: Introduction
  intro.no_viewer:
    text: existing interactive viewers rarely display these pairwise matrices
    file: manuscript/body.tex
    kind: comparison
    source: *noviewer
    status: ok
  intro.tahoe.n:
    text: all 95.6 million cells of Tahoe-100M
    file: manuscript/body.tex
    kind: number
    source: *n95
    compute: v[0] / 1e6
    format: 'all {:.1f} million cells of Tahoe-100M'
    status: ok
    note: "Marker added in Manu's pass of 2026-10-09 (24cd1eb); entry added at the merge."
  intro.datasets_100m:
    text: single-cell datasets now reach nearly 100 million cells
    file: manuscript/body.tex
    kind: number
    source: *n95
    compute: round(v[0] / 1e7) * 10
    format: 'single-cell datasets now reach nearly {:.0f} million cells'
    status: ok
    note: "Tahoe-100M, 95,624,334 cells (cited). Marker added in Manu's pass of 2026-10-09; entry added at the merge."
  intro.kernel_size:
    text: 100,000 cells holds $10^{10}$ values
    file: manuscript/body.tex
    kind: number
    compute: (100000, round(math.log10(100000 ** 2)))
    format: '{0:,.0f} cells holds $10^{{{1}}}$ values'
    status: ok
    note: Arithmetic, n squared.
  dev.subset_threshold:
    text: for datasets of more than 200,000 cells only their values
    file: manuscript/body.tex
    kind: number
    source: *threshold
    format: 'for datasets of more than {:,.0f} cells only their values'
    status: ok

  # ======================================================================= body.tex: fig:overview caption
  fig1.lacks:
    text: AnnZarro lacks annotation editing, on-the-fly differential expression, tissue image underlays and a static-site mode
    file: manuscript/body.tex
    kind: comparison
    source:
      - {matrix: annzarro.annot, expect: N}
      - {matrix: annzarro.de, expect: N}
      - {matrix: annzarro.image, expect: N}
      - {matrix: annzarro.static, expect: N}
    status: ok
  fig1.distinct:
    text: only AnnZarro reads genes~$\times$~genes matrices and lets a focused cell or gene choose the row
    file: manuscript/body.tex
    kind: comparison
    source:
      - {matrix: annzarro.cells, expect: Y}
      - {matrix: annzarro.genes, expect: Y}
      - {matrix: annzarro.focus, expect: Y}
      - {matrix: cellxgene-explorer.cells, expect: [N, P]}
      - {matrix: vitessce.cells, expect: [N, P]}
      - {matrix: cirrocumulus.cells, expect: [N, P]}
      - {matrix: isee.cells, expect: [N, P]}
      - {matrix: ucsc-cell-browser.cells, expect: [N, P]}
      - {matrix: shinycell.cells, expect: [N, P]}
      - {matrix: scope.cells, expect: [N, P]}
      - {matrix: scanpy-seurat.cells, expect: [N, P]}
      - {matrix: cellxgene-explorer.focus, expect: [N, P]}
      - {matrix: vitessce.focus, expect: [N, P]}
      - {matrix: cirrocumulus.focus, expect: [N, P]}
      - {matrix: isee.focus, expect: [N, P]}
      - {matrix: ucsc-cell-browser.focus, expect: [N, P]}
      - {matrix: shinycell.focus, expect: [N, P]}
      - {matrix: scope.focus, expect: [N, P]}
      - {matrix: scanpy-seurat.focus, expect: [N, P]}
      - {matrix: manivault.genes, expect: N}
      - {matrix: manivault.focus, expect: N}
    status: ok
  supp1.diamond_lower:
    text: Where a source gives only a lower bound (``more than''), the diamond marks that bound
    file: manuscript/supplement.tex
    kind: qualitative
    source:
      - {file: figures/fig_comparison.py, anchor: 'if lower and kind != "documented":   # documented sizes never carry an arrow'}
    status: ok
    note: iSEE (>170,000, cytometry) and Loupe (>1 million, release notes) are drawn as plain diamonds at the stated bound.
  fig1.cellxgene_policy:
    text: the largest observed on their public portals and drawn in full in a browser
    file: manuscript/supplement.tex
    kind: qualitative
    source:
      - {file: notes/comparison/cellxgene.md, anchor: 'Scale check: the 11.4M-cell dataset in the hosted Explorer'}
      - {file: notes/comparison/ucsc-cell-browser.md, anchor: 'Scale check'}
    status: ok

  # ======================================================================= body.tex: Comparison
  cmp.no_other_viewer:
    text: only ManiVault Studio colors an embedding by a stored cells~$\times$~cells row. The user selects the row by typing its index and is not shown which cell it belongs to
    file: manuscript/body.tex
    kind: comparison
    source:
      - {file: evidence/matrix/tools/manivault.yaml, anchor: 'one row at a time, but the row is picked by number,'}
      - {matrix: manivault.cells, expect: P}
      - {matrix: manivault.genes, expect: N}
      - {matrix: manivault.focus, expect: N}
      - {matrix: cellxgene-explorer.cells, expect: [N, P]}
      - {matrix: cellxgene-annotate.cells, expect: [N, P]}
      - {matrix: vitessce.cells, expect: [N, P]}
      - {matrix: cirrocumulus.cells, expect: [N, P]}
      - {matrix: isee.cells, expect: [N, P]}
      - {matrix: ucsc-cell-browser.cells, expect: [N, P]}
      - {matrix: single-cell-portal.cells, expect: [N, P]}
      - {matrix: shinycell.cells, expect: [N, P]}
      - {matrix: kana.cells, expect: [N, P]}
      - {matrix: scope.cells, expect: [N, P]}
      - {matrix: loupe.cells, expect: [N, P]}
    status: ok
  cmp.obsp_varp_code_only:
    text: The other viewers either ignore obsp and varp or reach them only through code
    file: manuscript/body.tex
    kind: comparison
    source: *noviewer
    status: ok
  cmp.focus_central:
    text: is the central difference
    file: manuscript/body.tex
    kind: comparison
    source:
      - {matrix: annzarro.focus, expect: Y}
      - {matrix: cellxgene-explorer.focus, expect: [N, P]}
      - {matrix: vitessce.focus, expect: [N, P]}
      - {matrix: ucsc-cell-browser.focus, expect: [N, P]}
      - {matrix: single-cell-portal.focus, expect: [N, P]}
      - {matrix: cirrocumulus.focus, expect: [N, P]}
      - {matrix: scope.focus, expect: [N, P]}
      - {matrix: shinycell.focus, expect: [N, P]}
      - {matrix: kana.focus, expect: [N, P]}
      - {matrix: isee.focus, expect: [N, P]}
    status: ok
    note: ledger row B5 re-scores the focus column.
  cmp.annotations:
    text: CELLxGENE, Cirrocumulus and Loupe edit annotations
    file: manuscript/body.tex
    kind: comparison
    source:
      - {matrix: cellxgene-annotate.annot, expect: Y}
      - {matrix: cirrocumulus.annot, expect: Y}
      - {matrix: loupe.annot, expect: Y}
    status: ok
  cmp.readonly:
    text: AnnZarro is read-only by design
    file: manuscript/body.tex
    context: CELLxGENE, Cirrocumulus and Loupe edit annotations
    kind: comparison
    source: {matrix: annzarro.annot, expect: N}
    status: ok
  cmp.refresh_shows:
    text: one refresh (Ctrl+R) shows them in the open views
    file: manuscript/body.tex
    kind: qualitative
    source:
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (a) zarr2 slice + ctrlr (within 60 s of the plot's load)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (a) zarr2 slice + dsbtn (within 60 s of the plot's load)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (a) zarr2 slice + panel (within 60 s of the plot's load)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (a) zarr2 write_elem + ctrlr (within 60 s of the plot's load)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (a) zarr2 write_elem + dsbtn (within 60 s of the plot's load)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (a) zarr2 write_elem + panel (within 60 s of the plot's load)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (c) zarr3 slice + ctrlr (within 60 s)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (c) zarr3 slice + panel (within 60 s)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (c) zarr3 write_elem + ctrlr (within 60 s)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (c) zarr3 write_elem + panel (within 60 s)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (c) h5ad slice + ctrlr (within 60 s)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (c) h5ad slice + panel (within 60 s)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (c) h5ad write_elem + ctrlr (within 60 s)"}
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (c) h5ad write_elem + panel (within 60 s)"}
    status: ok
    note: v0.4.1 refresh check, run on the tag (78c9da6, tree 661a454f); a correctness record, not a timing. Refresh = the Refresh-dataset button (Ctrl+R) or a panel's Refresh; a browser reload alone misses in-place zarr changes within 60 s (FAIL rows, controls).
  cmp.refresh_new_keys:
    text: new obs columns, layers and pairwise matrices included
    file: manuscript/body.tex
    kind: qualitative
    source:
      - {file: notes/sources/annzarro_v0.4.1_refresh.txt, anchor: "PASS   (b) zarr2 consolidated: new obs/layer/obsp/varp in the source menus, menus after ctrlr"}
