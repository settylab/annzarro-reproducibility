site_name: AnnZarro paper evidence
site_description: Every feature-matrix mark, benchmark number and figure behind the AnnZarro paper, with its sources.
# docs_dir and site_dir are set by the generated _build/mkdocs.yml (docs, site)
# file:// and offline review: page.html links, no server needed
use_directory_urls: false

copyright: >-
  Collected with AI assistance (Claude, Anthropic) under the authors' direction and reviewed by the authors.
  Found an error? Contact the authors;
  <a href="__ROOT__/index.html#how-this-record-was-made">how this record was made</a>.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light}
  font: false            # system fonts; no Google Fonts request

plugins:
  - search
  - offline

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css: [assets/evidence.css]
extra_javascript: [assets/matrix.js]
# nav: generated by build.py into _build/mkdocs.yml (core pages, tools, evidence/gen/* modules)
